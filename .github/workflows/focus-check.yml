name: Focus server check

on: workflow_dispatch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ask the focus server for today's counts
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          python3 - <<'PY'
          import datetime as dt, hashlib, hmac, os, urllib.request, urllib.error
          base = 'https://ielts-tracker.urazovvlv.workers.dev'
          def get(url, headers=None):
              req = urllib.request.Request(url, headers={"User-Agent": "ielts-reminders", **(headers or {})})
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return r.status, r.read()[:20000].decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.read()[:2000].decode("utf-8", "replace")
              except Exception as e:
                  return 0, repr(e)[:120]
          print("::notice::home", *get(base + "/"))
          tok = os.environ.get("BOT_TOKEN", "").strip()
          key = hmac.new(tok.encode(), b"ielts-focus-read", hashlib.sha256).hexdigest()
          today = (dt.datetime.utcnow() + dt.timedelta(hours=5)).date().isoformat()
          code, body = get(f"{base}/focus?ids=5020539876&date={today}", {"X-Key": key})
          print(f"::notice::focus {code} {body}")
          c2, b2 = get(f"{base}/user?ids=5020539876", {"X-Key": key})
          import json as _j
          try:
              d = (_j.loads(b2) if c2 == 200 else {}).get("5020539876") or {}
              for k in sorted((d.get('sv') or {}).keys())[-3:]: print(f"::notice::sv {k} {_j.dumps(d['sv'][k], ensure_ascii=False)[:600]}")
              for k in sorted((d.get('stats') or {}).keys())[-4:]: print(f"::notice::stats {k} {_j.dumps(d['stats'][k])}")
              for k in sorted((d.get('tl') or {}).keys()): print(f"::notice::tl {k} {_j.dumps(d['tl'][k], ensure_ascii=False)[:600]}")
              print(f"::notice::user {c2} keys={sorted(d.keys())} stats={len(d.get('stats') or {})} mocks={len(d.get('mocks') or [])} plan={(d.get('ext') or {}).get('plan')}")
          except Exception as ex:
              print(f"::notice::user {c2} {b2[:80]} {ex}")
          if code != 200:
              raise SystemExit(1)
          PY
