name: Focus server check

on: workflow_dispatch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ask the focus server for today's counts
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          python3 - <<'PY'
          import datetime as dt, hashlib, hmac, json, os, sys, urllib.request, urllib.error
          import reminders
          base = reminders.FOCUS_DEFAULT
          print("Server:", base)
          with urllib.request.urlopen(base + "/", timeout=20) as r:
              print("Home page:", r.status, r.read()[:60])
          key = hmac.new(os.environ["BOT_TOKEN"].encode(), b"ielts-focus-read", hashlib.sha256).hexdigest()
          today = dt.datetime.now(reminders.TZ).date().isoformat()
          req = urllib.request.Request(f"{base}/focus?ids=1&date={today}", headers={"X-Key": key, "User-Agent": "check"})
          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  print("Focus read OK:", r.status, r.read()[:100])
          except urllib.error.HTTPError as e:
              sys.exit(f"Focus read refused ({e.code}): BOT_TOKEN in Cloudflare is missing or differs from GitHub's")
          PY
