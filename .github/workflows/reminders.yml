name: IELTS reminders

# The reminders are sent by the Cloudflare Worker (worker/worker.js) on its own schedule:
# 07:00, 19:15 and 21:15 Tashkent, plus the weekly report at 23:00 on the last day of each plan week.
# This workflow only sends one by hand, for testing.

on:
  workflow_dispatch:
    inputs:
      slot:
        description: 'Which reminder to send now'
        type: choice
        options: [morning, evening, night, weekly]
        default: morning

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the Worker to send it
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SLOT: ${{ inputs.slot }}
        run: |
          python3 - <<'PY'
          import hashlib, hmac, json, os, urllib.request, urllib.error
          key = hmac.new(os.environ["BOT_TOKEN"].strip().encode(), b"ielts-focus-read", hashlib.sha256).hexdigest()
          url = f"https://ielts-tracker.urazovvlv.workers.dev/run?slot={os.environ['SLOT']}&force=1"
          req = urllib.request.Request(url, headers={"X-Key": key, "User-Agent": "ielts-reminders"})
          try:
              with urllib.request.urlopen(req, timeout=60) as r:
                  res = json.load(r)
          except urllib.error.HTTPError as e:
              raise SystemExit(f"::error::Worker refused ({e.code}): {e.read()[:200]}")
          for uid, status in res:
              print(f"::notice::user …{uid[-3:]}: {status if len(status) < 40 else 'built (dry run)'}")
          if not res:
              print("::notice::No users yet: open the tracker once so it can sync your plan.")
          PY
