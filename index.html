<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Road to 7.5</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first mini app — sticky header (day, level, streak), one scrolling view, bottom tab bar */
:root{
  --bg:#F2F4FA; --card:#FFFFFF; --sunk:#F6F8FC; --ink:#0D1A3A; --muted:#5B6890; --line:#DDE3F0;
  --navy:#1B3A8C; --navy-deep:#0E2160; --navy-soft:#E4EAF8; --gold:#C98A12; --gold-soft:#FBF0D7;
  --good:#1F8A5B; --bad:#C0392B;
  --ph1:#9DB4EA; --ph2:#5F82D9; --ph3:#2D4FA8; --ph4:#C98A12;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0A1124; --card:#121C36; --sunk:#0E1730; --ink:#E6ECF8; --muted:#8F9CBE; --line:#22304F;
  --navy:#7C9DF2; --navy-deep:#0B1A45; --navy-soft:#1A2850; --gold:#F0B947; --gold-soft:#2E2512;
  --good:#45C08A; --bad:#EE6B5C;
  --ph1:#2B3E73; --ph2:#3F5DB0; --ph3:#6E8FE6; --ph4:#F0B947;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body{padding-bottom:calc(74px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:var(--ink)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.note{font-size:12.5px;color:var(--muted)}
.wrap{padding:14px max(14px,env(safe-area-inset-left,0px)) 24px max(14px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;max-width:640px;margin:0 auto}

/* header */
.hdr{background:linear-gradient(135deg,var(--navy-deep),#1B3A8C 75%);color:#fff;padding:14px max(16px,env(safe-area-inset-left,0px)) 14px max(16px,env(safe-area-inset-right,0px));position:relative;overflow:hidden}
.hdr::after{content:var(--target,"7.5");position:absolute;right:-6px;bottom:-40px;font-family:var(--f-display);font-weight:800;font-size:130px;line-height:1;color:rgba(255,255,255,.07);pointer-events:none}
.hdr-in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:10px;position:relative;z-index:1}
.hdr-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hdr .eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.7);font-weight:700}
.hdr .day{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1.1}
.hdr .day small{font-size:15px;font-weight:700;opacity:.65}
.hdr .phase{font-size:13px;color:rgba(255,255,255,.8)}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.1);display:grid;place-items:center;color:#fff;flex:none}
.iconbtn svg{width:20px;height:20px}
.hdr-row{display:flex;gap:8px;align-items:center}
.lvl{flex:1;min-width:0;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:5px}
.lvl-top{display:flex;justify-content:space-between;font-size:12.5px;gap:8px}
.lvl-top b{font-family:var(--f-display);font-size:15px}
.hbar{height:7px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.hbar i{display:block;height:100%;background:#F0B947;border-radius:99px;transition:width .4s}
.streak{background:rgba(240,185,71,.16);border:1px solid rgba(240,185,71,.45);border-radius:12px;padding:6px 10px;text-align:center;min-width:64px}
.streak b{display:flex;align-items:center;justify-content:center;gap:3px;font-family:var(--f-display);font-size:20px;color:#F0B947;line-height:1.1}
.streak b svg{width:16px;height:16px}
.streak span{font-size:10.5px;color:rgba(255,255,255,.75)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:rgba(255,255,255,.75)}
.sync i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.5)}
.sync.ok i{background:#45C08A}.sync.busy i{background:#F0B947}.sync.err i{background:#EE6B5C}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card-h h2{font-size:18px}
.btn{border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:7px 12px;font-size:13.5px;font-weight:600;min-height:36px}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--card)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);font-weight:500;padding-left:0}
.btn.block{width:100%;min-height:44px;font-size:15px}
.btn.icon{width:36px;padding:0}
.daynav{display:flex;gap:6px;align-items:center}
.dayline{display:flex;align-items:center;gap:10px}
.badge-day{background:var(--navy-soft);color:var(--navy);border-radius:12px;padding:6px 10px;text-align:center;font-family:var(--f-display);font-weight:800;line-height:1.05;font-size:12px}
.badge-day b{display:block;font-size:22px}
.tag{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--gold-soft);color:var(--gold)}
.pline{display:flex;align-items:center;gap:10px}
.pbar{flex:1;height:8px;border-radius:99px;background:var(--navy-soft);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--navy);border-radius:99px;transition:width .3s}

/* tasks */
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.task{display:flex;gap:12px;align-items:center;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--sunk)}
.task input[type=checkbox]{appearance:none;-webkit-appearance:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--muted);flex:none;display:grid;place-items:center;margin:0;background:var(--card);cursor:pointer}
.task input[type=checkbox]:checked{background:var(--navy);border-color:var(--navy)}
.task input[type=checkbox]:checked::after{content:"";width:6px;height:11px;border:solid var(--card);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.task .tx{flex:1;min-width:0;cursor:pointer}
.task .tx b{display:block;font-weight:600}
.task .tx small{display:block;color:var(--muted);font-size:12.5px}
.task .xp{font-size:11px;font-weight:700;color:var(--gold);white-space:nowrap}
.task.done{background:var(--navy-soft);border-color:transparent}
.task.done .tx b{text-decoration:line-through;color:var(--muted)}
.task.main{border-left:4px solid var(--gold)}
.task.editing{background:var(--card);padding:8px}
.ef{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.ein{width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:7px 8px;font-weight:600}
.ein.sm{font-weight:400;font-size:13px}
.rm{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);font-size:18px;color:var(--muted);flex:none}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--sunk)}
.seg button{flex:1;border:0;background:none;padding:8px 6px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--navy);color:var(--card)}
.addrow{display:flex;flex-direction:column;gap:6px;padding:10px;border:1px dashed var(--navy);border-radius:12px;background:var(--navy-soft)}
.addrow input,.field input[type=text],.field input[type=search],textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 10px}
textarea{min-height:70px;resize:vertical;background:var(--sunk)}

/* inputs */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--sunk);overflow:hidden}
.stepper button{border:0;background:none;width:40px;height:42px;font-size:17px;font-weight:700;color:var(--navy);flex:none}
.stepper input{flex:1;min-width:0;border:0;background:none;text-align:center;font-size:17px;font-weight:700;height:42px;-moz-appearance:textfield}
.stepper input::-webkit-inner-spin-button,.stepper input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.mood{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.mood button{border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:6px 2px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center}
.mood button b{font-size:16px;color:var(--ink)}
.mood button.on{background:var(--navy);border-color:var(--navy);color:var(--card)}
.mood button.on b{color:var(--card)}

/* word of the day */
.wotd{background:var(--gold-soft);border-color:transparent}
.wotd .w{font-family:var(--f-display);font-size:22px;font-weight:800;line-height:1.15}
.wotd .uz{font-weight:600}
.wotd .ex{font-style:italic;color:var(--muted)}

/* stats & map */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.1}
.stat .v small{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:600;margin-left:3px}
.stat.hot{background:var(--gold-soft);border-color:transparent}
.stat.hot .v{color:var(--gold)}
.map{display:grid;grid-template-columns:28px repeat(7,minmax(0,1fr));gap:4px}
.map .wd{font-size:10px;font-weight:700;color:var(--muted);text-align:center}
.map .wk{font-size:10.5px;color:var(--muted);font-weight:700;display:flex;align-items:center}
.cell{position:relative;aspect-ratio:1/1;border-radius:8px;border:1px solid var(--line);background:var(--sunk);font-size:11px;font-weight:700;display:flex;align-items:flex-start;justify-content:flex-start;padding:3px 4px}
.cell.future{opacity:.5}
.cell.today{outline:2px solid var(--gold);outline-offset:1px}
.cell .mk{position:absolute;top:4px;right:4px;width:7px;height:7px;transform:rotate(45deg);background:var(--gold);border-radius:1px}
.cell .ph{position:absolute;left:4px;right:4px;bottom:3px;height:3px;border-radius:2px}
.cell.blank{visibility:hidden}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.chart svg{display:block;width:100%;height:auto}
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.bdg{border:1px dashed var(--line);border-radius:12px;padding:8px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);line-height:1.2}
.bdg svg{width:24px;height:24px}
.bdg b{font-size:12px}
.bdg.got{border-style:solid;border-color:var(--gold);background:var(--gold-soft);color:var(--ink)}

/* mocks */
.mock{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--sunk);display:flex;flex-direction:column;gap:8px}
.mock.next{border-color:var(--gold);background:var(--gold-soft)}
.mock-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mock-h small{display:block;color:var(--muted);font-size:12px}
.sc4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.sc4 label{display:flex;flex-direction:column;gap:3px;font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;text-align:center}
.sc{width:100%;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 2px;text-align:center;font-size:15px;font-weight:700;-moz-appearance:textfield}
.sc::-webkit-inner-spin-button{-webkit-appearance:none}
.bh{font-size:10.5px;font-weight:600;color:var(--muted);min-height:13px;text-transform:none;letter-spacing:0}
.pill{font-weight:800;font-size:15px;border-radius:99px;padding:4px 12px;background:var(--card);border:1px solid var(--line);color:var(--muted);font-family:var(--f-display)}
.pill.hit{background:var(--good);border-color:transparent;color:#fff}
.pill.c1{background:var(--navy);border-color:transparent;color:var(--card)}
.pill.low{color:var(--ink)}

/* words */
.wlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.witem{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line);border-radius:12px;background:var(--sunk)}
.witem .tx{flex:1;min-width:0}
.witem b{display:block}
.witem small{display:block;color:var(--muted);font-size:12.5px}
.known{font-size:10.5px;font-weight:700;color:var(--good)}
.flash{border-radius:16px;padding:22px 16px;background:var(--navy);color:#fff;text-align:center;display:flex;flex-direction:column;gap:10px;min-height:170px;justify-content:center;cursor:pointer}
.flash .fw{font-family:var(--f-display);font-size:26px;font-weight:800}
.flash .fm{font-size:16px;font-weight:600}
.flash .fe{font-size:13.5px;opacity:.8;font-style:italic}
.flash .hint{font-size:12px;opacity:.65}

/* speaking timer */
.cue{background:var(--sunk);border:1px solid var(--line);border-radius:14px;padding:14px}
.cue h3{font-size:18px;margin-bottom:6px}
.cue ul{margin:6px 0 0;padding-left:18px;color:var(--muted)}
.ring{display:grid;place-items:center;position:relative;margin:4px auto 0;width:200px;max-width:70vw;aspect-ratio:1/1}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring>div{position:relative;max-width:66%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.ring .t{font-family:var(--f-display);font-size:40px;line-height:1.05;font-weight:800;font-variant-numeric:tabular-nums}
.ring .p{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);line-height:1.3}

/* tutor */
.wz{gap:14px}
.wz p{margin:0}
.wz h2{font-size:21px}
.wz-prog{display:flex;align-items:center;gap:10px}
.wz-nav{display:flex;justify-content:space-between;gap:10px;margin-top:4px}
.wz-nav .btn{min-height:44px;padding:0 18px;font-size:15px}
.wz-list{margin:0;padding-left:18px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.col{flex-direction:column;align-items:stretch}
.chip{border:1px solid var(--line);background:var(--sunk);border-radius:99px;padding:8px 13px;font-size:13.5px;font-weight:600;color:var(--ink);text-align:left}
.chips.col .chip{border-radius:12px}
.chip.on{background:var(--navy);border-color:var(--navy);color:var(--card)}
.skillbox{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--sunk)}
.skillbox .mood button{background:var(--card)}
.skillbox .mood button.on{background:var(--navy)}
.passage{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:14.5px;line-height:1.55}
.passage h3{font-size:16px}
.q{display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.lrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center;font-size:14px}
.rbars{display:flex;flex-direction:column;gap:9px}
.rb{display:grid;grid-template-columns:76px 1fr 34px;grid-template-rows:auto auto;column-gap:8px;align-items:center}
.rb-l{font-size:13px;font-weight:600}
.rb-t{position:relative;height:10px;border-radius:99px;background:var(--navy-soft)}
.rb-t i{display:block;height:100%;border-radius:99px;background:var(--navy)}
.rb-t i.ok{background:var(--good)}
.rb-t em{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--gold);border-radius:2px}
.rb b{font-family:var(--f-display);font-size:16px;text-align:right}
.rb small{grid-column:2/4;font-size:11px;color:var(--muted)}
.verdict{border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px;border:1px solid var(--line)}
.verdict.good{background:color-mix(in srgb,var(--good) 12%,var(--card));border-color:transparent}
.verdict.warn{background:var(--gold-soft);border-color:transparent}
.verdict.bad{background:color-mix(in srgb,var(--bad) 12%,var(--card));border-color:transparent}
.verdict small{color:var(--muted);font-size:12px}
.prio{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(6px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-right,0px));z-index:10}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0;border-radius:10px}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--navy)}
.tabs button.on svg{stroke-width:2.4}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(5,10,25,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px max(14px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.idbox{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.idbox code{flex:1;font-size:18px;font-weight:700;letter-spacing:.03em}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:30;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="hdr"><div class="hdr-in" id="hdr"></div></header>
<main id="view"><div class="wrap"><div class="card"><p class="note" style="margin:0">Loading your progress…</p></div></div></main>
<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<div id="sheetHost"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
/* ---------- Telegram ---------- */
const TG=(window.Telegram&&window.Telegram.WebApp)||null;
const inTG=!!(TG&&TG.initData);
const ver=v=>!!(TG&&TG.isVersionAtLeast&&TG.isVersionAtLeast(v));
const CLOUD=inTG&&ver('6.9')&&!!TG.CloudStorage;
function applyTheme(){
  const dark=inTG?TG.colorScheme==='dark':(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme=dark?'dark':'light';
  if(inTG&&ver('6.1')){try{TG.setHeaderColor(dark?'#0B1A45':'#0E2160');TG.setBackgroundColor(dark?'#0A1124':'#F2F4FA');}catch(e){}}
  if(inTG&&ver('7.10')){try{TG.setBottomBarColor(dark?'#121C36':'#FFFFFF');}catch(e){}}
}
if(inTG){TG.ready();try{TG.expand();}catch(e){} TG.onEvent&&TG.onEvent('themeChanged',applyTheme);}
applyTheme();

  for(let n=2;n<=weeklyEnd;n++)if(dateOf(n).getDay()===0)days.push(n);
  let d=days[days.length-1],step=3;

const LS='r75:';
const lsGet=k=>{try{return localStorage.getItem(LS+k);}catch(e){return null;}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(LS+k):localStorage.setItem(LS+k,v);}catch(e){}};
function lsAll(){const o={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(LS))o[k.slice(LS.length)]=localStorage.getItem(k);}}catch(e){}return o;}
const cs=(m,...a)=>new Promise((res,rej)=>{try{TG.CloudStorage[m](...a,(err,val)=>err?rej(err):res(val));}catch(e){rej(e);}});
async function cloudAll(){const keys=await cs('getKeys');const o={};for(let i=0;i<keys.length;i+=40){Object.assign(o,await cs('getItems',keys.slice(i,i+40)));}return o;}
const q=new Map(),tries={};let busy=false,failed=false;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function put(k,v){if(!CLOUD)return;q.delete(k);q.set(k,v);setSync('busy');kick();}
async function kick(){
  if(busy)return;busy=true;
  try{
    while(q.size){
      const [k,v]=q.entries().next().value;q.delete(k);
      try{if(v==null)await cs('removeItem',k);else await cs('setItem',k,v);tries[k]=0;}
      catch(e){tries[k]=(tries[k]||0)+1;if(tries[k]<4){if(!q.has(k))q.set(k,v);}else failed=true;setSync('err');await sleep(2500);}
    }
    setSync(failed?'err':'ok');
  }finally{busy=false;}
}
function getObj(k){
  if(k==='plan')return PLAN;
  if(/^d\d{2,3}$/.test(k))return S.days[k];if(/^w\d{1,2}$/.test(k))return S.weeks[k];if(/^m\d{2,3}$/.test(k))return S.mocks[k];
  if(k==='cfg_day')return S.cfg.day;if(k==='cfg_week')return S.cfg.week;if(k==='settings')return S.settings;return null;
}
function setObj(k,o){
  if(k==='plan'){if(o&&o.start)PLAN=o;}
  else if(/^d\d{2,3}$/.test(k))S.days[k]=o;else if(/^w\d{1,2}$/.test(k))S.weeks[k]=o;else if(/^m\d{2,3}$/.test(k))S.mocks[k]=o;

}
const timers={};
function touch(k,later){
  const o=getObj(k);if(!o)return;o._ts=Date.now();const v=JSON.stringify(o);lsSet(k,v);
  clearTimeout(timers[k]);
  if(later)timers[k]=setTimeout(()=>put(k,JSON.stringify(getObj(k))),600);else put(k,v);
}
let wordsN=0;
function saveWords(){
  S.wordsTs=Date.now();const chunks=[];let cur=[],len=2;
  for(const w of S.words){const s=JSON.stringify(w);if(len+s.length+1>3600&&cur.length){chunks.push(cur);cur=[];len=2;}cur.push(w);len+=s.length+1;}
  if(cur.length)chunks.push(cur);
  chunks.forEach((c,i)=>{const v=JSON.stringify(c);lsSet('words_'+i,v);put('words_'+i,v);});
  for(let i=chunks.length;i<wordsN;i++){lsSet('words_'+i,null);put('words_'+i,null);}
  wordsN=chunks.length;const meta=JSON.stringify({n:wordsN,_ts:S.wordsTs});lsSet('words_n',meta);put('words_n',meta);
}
function readWords(src){
  let meta=null;try{meta=JSON.parse(src.words_n||'null');}catch(e){}
  if(!meta)return null;const out=[];
  for(let i=0;i<meta.n;i++){try{out.push(...JSON.parse(src['words_'+i]||'[]'));}catch(e){}}
  return {n:meta.n,ts:meta._ts||0,list:out};
}
async function load(){
  const local=lsAll();let cloud={},cloudOk=false;
  if(CLOUD){try{cloud=await cloudAll();cloudOk=true;}catch(e){setSync('err');}}
  const keys=new Set([...Object.keys(local),...Object.keys(cloud)].filter(k=>!k.startsWith('words_')));
  for(const k of keys){
    let a=null,b=null;try{a=JSON.parse(cloud[k]||'null');}catch(e){}try{b=JSON.parse(local[k]||'null');}catch(e){}
    const pick=(b&&(!a||(b._ts||0)>(a._ts||0)))?b:a;if(!pick||typeof pick!=='object')continue;
    setObj(k,pick);
    if(cloudOk&&pick===b&&b)put(k,local[k]);
    if(pick===a)lsSet(k,cloud[k]);
  }
  const wc=readWords(cloud),wl=readWords(local);
  const w=(wl&&(!wc||wl.ts>wc.ts))?wl:wc;
  if(w){S.words=w.list;S.wordsTs=w.ts;wordsN=w.n;if(cloudOk&&w===wl)saveWords();}
  if(CLOUD&&cloudOk&&!q.size)setSync('ok');
}

const dayDoc=n=>S.days['d'+pad(n)]||{};
const weekDoc=w=>S.weeks['w'+w]||{};
const mockDoc=n=>S.mocks['m'+pad(n)]||{};
function setDay(n,patch,later){const k='d'+pad(n);S.days[k]=Object.assign({},S.days[k],patch);touch(k,later);}
function applyMods(list,m){
  m=m||{};const hid=new Set(m.hidden||[]);const rn=m.rename||{};
  return list.concat((m.extra||[]).map(x=>({k:x.k,label:x.label,sub:x.sub||''}))).filter(x=>!hid.has(x.k))
    .map(x=>rn[x.k]?Object.assign({},x,{label:rn[x.k].label??x.label,sub:rn[x.k].sub??x.sub}):x);
}
const listFor=n=>applyMods(applyMods(baseTasks(n),S.cfg.day),dayDoc(n));
const weekList=()=>applyMods(WEEKTASKS,S.cfg.week);
const doneCount=n=>{const t=dayDoc(n).t||{};return listFor(n).filter(x=>t[x.k]).length;};
const totalCount=n=>listFor(n).length;
const frac=n=>{const t=totalCount(n);return t?doneCount(n)/t:0;};
const dayOk=n=>{const t=totalCount(n);return t>0&&doneCount(n)>=Math.min(4,t);};
const num=v=>Number(v)||0;
function overall(m){
  const L=toBand(m.L,LB),R=toBand(m.R,RB);
  const W=m.W===''||m.W==null?null:Number(m.W),Sp=m.S===''||m.S==null?null:Number(m.S);
  if([L,R,W,Sp].some(v=>v==null||isNaN(v)))return null;
  return Math.round(((L+R+W+Sp)/4)*2)/2;
}
function totals(){
  let xp=0,hours=0,words=0,tasks=0;
  for(let n=1;n<=DAYS;n++){const d=dayDoc(n),c=doneCount(n);tasks+=c;hours+=num(d.hours);words+=num(d.words);xp+=c*10+Math.round(num(d.hours)*10)+(d.mood?5:0);}
  const WL=weekList();for(let w=1;w<=Math.ceil(DAYS/7);w++){const t=weekDoc(w).t||{};xp+=WL.filter(x=>t[x.k]).length*20;}
  let best=null;for(const n of MOCKDAYS){const o=overall(mockDoc(n));if(o!=null){xp+=50;best=best==null?o:Math.max(best,o);}}
  xp+=S.words.length*2;
  return {xp,hours,words,tasks,best};
}
function streaks(){
  const t=Math.min(todayIdx(),DAYS);let cur=0;
  if(t>=1){let i=dayOk(t)?t:t-1;while(i>=1&&dayOk(i)){cur++;i--;}}
  let best=0,run=0;for(let n=1;n<=Math.max(0,t);n++){run=dayOk(n)?run+1:0;best=Math.max(best,run);}
  return {cur,best};
}
const levelOf=xp=>{let i=0;LEVELS.forEach((l,k)=>{if(xp>=l.x)i=k;});return i;};

    const f=frac(n),bg=f===0?'var(--sunk)':`color-mix(in srgb, var(--navy) ${Math.round(18+f*72)}%, var(--card))`,ink=f>=.6?'var(--card)':'var(--ink)';

const wordItems=list=>list.length?list.map(w=>`<li class="witem"><div class="tx"><b>${esc(w.w)}</b>${w.m?`<small>${esc(w.m)}</small>`:''}${w.ex?`<small style="font-style:italic">${esc(w.ex)}</small>`:''}${w.k?`<span class="known">Known ${w.k}×</span>`:''}</div><button class="rm" data-delword="${w.id}" aria-label="Delete ${esc(w.w)}">×</button></li>`).join(''):`<li class="note">${S.words.length?'No words match.':'No words yet. Save the word of the day or add your own.'}</li>`;

/* ---------- Speak ---------- */
function viewSpeak(){
  const c=CUES[timer.cue];
  return `<div class="wrap"><section class="card"><div class="card-h"><h2>Part 2 practice</h2><button class="btn" data-cue="next">New card</button></div>
  <div class="cue"><div class="label">Cue card</div><h3>${esc(c[0])}</h3><span class="note">You should say:</span><ul>${c[1].map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
  <div class="ring" id="ring">${ringSvg()}<div><div class="t" id="tt">${timeLeftText()}</div><div class="p" id="tp">${phaseText()}</div></div></div>
  <div id="tctrl">${timerCtrls()}</div>
  <p class="note" style="margin:0">Real exam: 1 minute to prepare and make notes, then speak for 2 minutes. Record yourself on your phone and listen back for pauses, repeated words and grammar slips.</p></section></div>`;
}
function timeLeft(){if(timer.phase==='prep'||timer.phase==='speak')return Math.max(0,timer.end-Date.now());if(timer.phase==='done')return 0;return 60000;}
const timeLeftText=()=>{const s=Math.ceil(timeLeft()/1000);return `${Math.floor(s/60)}:${pad(s%60)}`;};
const phaseText=()=>({idle:'1 min prepare · 2 min speak',prep:'Prepare · make notes',speak:'Speak now',done:'Time is up'})[timer.phase];
function ringSvg(){
  const r=44,C=2*Math.PI*r,p=(timer.phase==='prep'||timer.phase==='speak')?timeLeft()/timer.dur:(timer.phase==='done'?0:1);
  const col=timer.phase==='speak'?'var(--gold)':'var(--navy)';
  return `<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--navy-soft)" stroke-width="7"/><circle id="rc" cx="50" cy="50" r="${r}" fill="none" stroke="${col}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}"/></svg>`;
}
function timerCtrls(){
  if(timer.phase==='idle')return '<button class="btn block primary" data-timer="start">Start: 1 min prepare</button>';
  if(timer.phase==='prep')return '<div class="grid2"><button class="btn block" data-timer="reset">Reset</button><button class="btn block primary" data-timer="speak">Start speaking now</button></div>';
  if(timer.phase==='speak')return '<button class="btn block" data-timer="reset">Stop</button>';
  const done=(dayDoc(clampDay(todayIdx())).t||{}).speak;
  return `<div class="grid2"><button class="btn block" data-timer="reset">Again</button><button class="btn block primary" data-timer="mark" ${done?'disabled':''}>${done?'Marked as done':'Mark Speaking task done'}</button></div>`;
}
let tick=null;
function startPhase(ph,ms){timer.phase=ph;timer.dur=ms;timer.end=Date.now()+ms;haptic('medium');clearInterval(tick);tick=setInterval(timerTick,200);if(tab==='speak')renderView();}
function timerTick(){
  if(timer.phase!=='prep'&&timer.phase!=='speak'){clearInterval(tick);return;}
  if(timeLeft()<=0){if(timer.phase==='prep'){startPhase('speak',120000);return;}timer.phase='done';clearInterval(tick);haptic('ok');if(tab==='speak')renderView();return;}
  if(tab!=='speak')return;
  const tt=document.getElementById('tt');if(tt)tt.textContent=timeLeftText();
  const rc=document.getElementById('rc');if(rc){const C=2*Math.PI*44;rc.setAttribute('stroke-dashoffset',C*(1-timeLeft()/timer.dur));}
}

const SK={L:'Listening',R:'Reading',W:'Writing',S:'Speaking'};
const PROBLEMS={
  L:[['spelling','Spelling names & numbers'],['speed','Fast speakers'],['maps','Maps & plans'],['distract','Speakers change answers'],['focus','Losing focus in Parts 3–4']],
  R:[['time','Running out of time'],['tfng','True / False / Not Given'],['headings','Matching headings'],['vocab','Unknown words'],['long','Long, dense passages']],
  W:[['ideas','Finding ideas'],['grammar','Grammar mistakes'],['overview','Task 1 overview'],['coherence','Paragraph structure'],['time','Finishing on time']],
  S:[['fluency','Pausing, hesitating'],['vocab','Limited vocabulary'],['pron','Pronunciation'],['part2','Speaking for 2 minutes'],['ideas','Ideas for Part 3']]
};
const DRILLS={
  L:{spelling:'Dictation: 10 names, numbers and dates, then check spelling',speed:'Shadowing: repeat a 2-minute BBC clip at full speed',maps:'One map or plan task + direction words (opposite, next to…)',distract:'Sections 1–2: mark every place a speaker changes an answer',focus:'Section 4 lecture: note-taking practice, then answer'},
  R:{time:'One passage in exactly 18 minutes, no extra time',tfng:'15 True / False / Not Given statements, explain each answer',headings:'Matching headings: one passage, read first sentences only',vocab:'Paraphrase hunt: find 10 word pairs in a passage',long:'Skim three passages, 3 minutes each, main idea only'},
  W:{ideas:'Plan three Task 2 questions, 5 minutes each (ideas only)',grammar:'Rewrite 5 of your sentences using complex structures',overview:'Write only the overview for two Task 1 charts',coherence:'One body paragraph: idea → explanation → example',time:'Timed: Task 2 intro + one body paragraph in 15 minutes'},
  S:{fluency:'Talk for 2 minutes non-stop on a random topic, recorded',vocab:'Learn 5 natural phrases for one Part 1 topic and use them',pron:'Shadow a 1-minute clip, copying stress and intonation',part2:'Part 2 card: 1 min notes, then a full 2-minute talk',ideas:'Answer 4 Part 3 questions: opinion + reason + example'}
};
const MAINS={
  full:{L:[['Listening: full test, 4 sections + transcript check',45],['Listening: Sections 3–4 twice + dictation',40]],
        R:[['Reading: full test, 60 minutes',60],['Reading: one passage for each question type you find hard',45]],
        W:[['Writing Task 2 essay, 40 minutes',45],['Writing Task 1 report, 20 minutes + rewrite',35]],
        S:[['Speaking: full test recorded (Parts 1–3)',30],['Speaking: three Part 2 cards + Part 3 questions',30]]},
  short:{L:[['Listening: two sections + transcript check',20]],R:[['Reading: one passage in 20 minutes',20]],
        W:[['Writing: Task 2 plan + one body paragraph',20]],S:[['Speaking: two Part 2 cards, recorded',20]]}
};
/* Same rotation as reminders.py: weakest skill twice, second twice, third and fourth once, Sunday review. */
const ROTA=[0,1,2,0,1,3,-1];
function mainFor(n,p){
  const wd=(dateOf(n).getDay()+6)%7,mins=wd>=5?p.mwe:p.mwd;
  if(MOCKS[n])return {label:`Full mock · ${MOCKS[n]}`,sub:mins<150?'About 2 h 45 min. Short on time? Do Listening + Reading today, Writing + Speaking tomorrow.':'L 30 · R 60 · W 60 · S 15 min, exam conditions',m:165};
  const r=ROTA[wd];if(r<0)return {label:'Weekly review: redo this week\'s mistakes',sub:'Then plan next week',m:30};
  const sk=p.rank[r],v=ROTA.slice(0,wd).filter(x=>x===r).length,set=mins<60?MAINS.short:MAINS.full,opt=set[sk][Math.min(v,set[sk].length-1)];
  return {label:opt[0],sub:`${SK[sk]} focus`,m:opt[1],sk};
}
function genTasks(n,p){
  const wd=(dateOf(n).getDay()+6)%7,M=wd>=5?p.mwe:p.mwd,mn=mainFor(n,p);
  const out=[{k:'main',label:mn.label,sub:`${mn.sub} · ~${mn.m} min`,main:true}];let used=mn.m;
  const probs=sk=>(p.problems&&p.problems[sk]&&p.problems[sk].length?p.problems[sk]:PROBLEMS[sk].map(x=>x[0]));
  const drill=(sk,i)=>{const ps=probs(sk);return DRILLS[sk][ps[(n+i)%ps.length]];};
  const add=(k,label,why,m,cond)=>{if(cond===false||used+m>M+10)return;out.push({k,label,sub:`${why} · ~${m} min`});used+=m;};
  const pos=sk=>p.rank.indexOf(sk);
  add('words',M<60?'10 new words in Anki':'20 new words in Anki','Collocations, not single words',M<60?10:15);
  add('drill',drill(p.rank[0],0),`${SK[p.rank[0]]} is your weakest skill`,15);
  add('speak','Speaking: one Part 2 recording','Listen back for pauses and mistakes',10,mn.sk!=='S'&&pos('S')<=2);
  add('grammar','Grammar: 15 min on one error type','Pick it from your mistake log',15,pos('W')<=1||pos('S')<=1);
  add('listen','Listening section + transcript','Find why each answer was missed',20,mn.sk!=='L'&&pos('L')<=2);
  add('drill2',drill(p.rank[1],1),`${SK[p.rank[1]]} practice`,15);
  out.push({k:'log',label:'Mistake log updated',sub:'One line per error, type + fix · ~5 min'});
  return out;
}

const norm=s=>String(s||'').toLowerCase().replace(/[\s,]/g,'').replace(/[^a-z0-9.:£]/g,'');
const ttsOK=()=>'speechSynthesis' in window&&typeof SpeechSynthesisUtterance!=='undefined';
function scoreTest(t){
  const g=t.g?GQ.filter((q,i)=>t.g[i]===q[2]).length:null;
  const r=t.r?RQ.filter((q,i)=>{const v=t.r[i];if(q.t==='gap')return q.a.includes(norm(v));return v===q.a;}).length:null;
  const l=t.l?LQ.filter((q,i)=>{const v=norm(t.l[i]);return q.a.includes(v)||q.a.includes(v.replace(/^£/,'').replace(/pounds?$/,''));}).length:null;
  return {g,r,l};
}
const half=x=>Math.round(x*2)/2;
const clampB=x=>Math.max(3.5,Math.min(9,x));
function estimate(d,t){
  const sc=scoreTest(t),conf={1:4.5,2:5,3:5.5,4:6,5:6.5},prev=d.hasPrev?d.prev:null,est={},src={};
  for(const k of ['L','R','W','S']){
    let base=conf[d.conf[k]||3];src[k]='self-check';
    if(prev&&prev[k]){base=Number(prev[k]);src[k]='previous IELTS';}
    est[k]=base;
  }
  if(sc.r!=null&&t.rDone){const b=toBand(Math.round(sc.r/8*40),RB);est.R=prev&&prev.R?half((b+Number(prev.R))/2):b;src.R='placement test';}
  if(sc.l!=null&&t.lDone){const b=Math.min(7,toBand(Math.round(sc.l/6*40),LB));est.L=prev&&prev.L?half((b+Number(prev.L))/2):b;src.L='placement test';}
  if(sc.g!=null&&t.gDone){const adj=sc.g>=9?0.5:sc.g<=5?-0.5:0;for(const k of ['W','S'])if(!(prev&&prev[k]))est[k]=est[k]+adj;}
  for(const k in est)est[k]=clampB(half(est[k]));
  const overallNow=half((est.L+est.R+est.W+est.S)/4);
  const target=Number(d.target)||7,need=Math.max(Number(d.minSkill)||0,0);
  const gapOf=k=>Math.max(target,need)-est[k];
  const rank=['L','R','W','S'].sort((a,b)=>gapOf(b)-gapOf(a)||(d.conf[a]||3)-(d.conf[b]||3));
  const days=d.exam?dayDiff(d.start,d.exam):Number(d.days)||60;
  let hours=0;for(let i=0;i<days;i++){const dt=new Date(parseD(d.start).getTime()+i*864e5),we=dt.getDay()===0||dt.getDay()===6;hours+=(we?d.mwe:d.mwd)/60;}
  const gap=Math.max(0,target-overallNow),needH=gap*175;
  const verdict=gap<=0?['good','You are already around your target. Focus on consistency and exam technique.']:hours>=needH?['good','Realistic with steady daily work.']:hours>=needH*0.6?['warn','Ambitious but possible. Do not skip days.']:['bad','Very ambitious. Add daily time or choose a later exam date if you can.'];
  return {est,src,overallNow,rank,days,hours:Math.round(hours),needH:Math.round(needH),gap,verdict,sc};
}

function viewTest(){
  const t=WZ.t,part=WZ.part;

  let body='';
  if(part==='g')body=`<p class="note" style="margin:0">10 questions · about 4 minutes · choose the best answer.</p>${GQ.map((q,i)=>`<div class="q"><p><b>${i+1}.</b> ${esc(q[0])}</p><div class="chips">${q[1].map((o,j)=>`<button type="button" class="chip ${t.g[i]===j?'on':''}" data-wg="${i}" data-val="${j}">${esc(o)}</button>`).join('')}</div></div>`).join('')}
    <button class="btn block primary" data-wdone="g">Finish grammar</button>`;
  if(part==='r')body=`<p class="note" style="margin:0">One short passage · 8 questions · about 10 minutes.</p>
    <div class="passage"><h3>Vertical farming: promise and limits</h3>${PASSAGE.map(([k,p])=>`<p><b>${k}</b> ${esc(p)}</p>`).join('')}</div>
    <p class="label" style="margin:6px 0 0">Questions 1–4 · TRUE, FALSE or NOT GIVEN?</p>
    ${RQ.map((q,i)=>`<div class="q"><p><b>${i+1}.</b> ${esc(q.q)}</p>${q.t==='tfng'?`<div class="chips">${['TRUE','FALSE','NOT GIVEN'].map(o=>`<button type="button" class="chip ${t.r[i]===o?'on':''}" data-wr="${i}" data-val="${o}">${o}</button>`).join('')}</div>`:q.t==='mc'?`<div class="chips col">${q.o.map((o,j)=>`<button type="button" class="chip ${t.r[i]===j?'on':''}" data-wr="${i}" data-val="${j}">${'ABCD'[j]}. ${esc(o)}</button>`).join('')}</div>`:`<input type="text" class="ein" data-wrt="${i}" value="${esc(t.r[i]||'')}" placeholder="ONE WORD" maxlength="20">`}</div>`).join('')}
    <button class="btn block primary" data-wdone="r">Finish reading</button>`;
  if(part==='l')body=ttsOK()?`<p class="note" style="margin:0">A phone call, like IELTS Listening Part 1. Read the form first. You can play it <b>once</b>, like the real test. Turn your sound on.</p>
    <button class="btn block ${WZ.lPlays?'':'primary'}" data-wplay="1" ${WZ.lPlays?'disabled':''}>${WZ.lPlays?(WZ.playing?'Playing…':'Played'):'▶ Play recording'}</button>
    <div class="q"><p class="label">Course booking form · write a word or number</p>${LQ.map((q,i)=>`<label class="lrow"><span>${i+1}. ${esc(q.q)}</span><input type="text" class="ein" data-wlt="${i}" value="${esc(t.l[i]||'')}" maxlength="30"></label>`).join('')}</div>
    <button class="btn block primary" data-wdone="l">Finish listening</button>`
    :`<p class="note">This device cannot play the listening test. That's fine: your self-check is used for Listening, and your Day 1 mock will measure it properly.</p>`;
  return `<h2>Placement test</h2>${tabs}${body}${wzNav(t.gDone||t.rDone||t.lDone?'See my results':'Skip the test')}`;
}
function viewResult(){
  const d=WZ.d,R=estimate(d,WZ.t);WZ.R=R;
  const tgt=Math.max(Number(d.target),Number(d.minSkill)||0);
  const bars=['L','R','W','S'].map(k=>{const e=R.est[k],w=(e-3)/6*100,tw=(tgt-3)/6*100;return `<div class="rb"><span class="rb-l">${SK[k]}</span><div class="rb-t"><i style="width:${w}%" class="${e>=tgt?'ok':''}"></i><em style="left:${tw}%"></em></div><b class="num">${e.toFixed(1)}</b><small>${R.src[k]}</small></div>`;}).join('');
  const keep=[PLAN,DAYS,START,MOCKS,MOCKDAYS,PHASES,TARGET];buildSchedule({start:d.start,exam:d.exam,days:d.days,target:d.target});
  let sn=2;while(sn<DAYS&&(MOCKS[sn]||[0,6].includes(dateOf(sn).getDay())))sn++;
  const sample=genTasks(sn,{rank:R.rank,mwd:d.mwd,mwe:d.mwe,problems:d.problems}),sampleDay=fmt(dateOf(sn));
  [PLAN,DAYS,START,MOCKS,MOCKDAYS,PHASES,TARGET]=keep;
  const v=R.verdict;
  return `<h2>Your results</h2>
    <div class="stats"><div class="stat"><span class="label">Now (estimate)</span><span class="v">${R.overallNow.toFixed(1)}</span></div><div class="stat hot"><span class="label">Target</span><span class="v">${Number(d.target).toFixed(1)}</span></div></div>
    <div class="rbars">${bars}<p class="note" style="margin:0">The line shows your target${Number(d.minSkill)?' (or skill minimum)':''}.</p></div>
    ${R.sc.g!=null&&WZ.t.gDone?`<p class="note" style="margin:0">Grammar test: <b>${R.sc.g}/10</b>${WZ.t.rDone?` · Reading: <b>${R.sc.r}/8</b>`:''}${WZ.t.lDone?` · Listening: <b>${R.sc.l}/6</b>`:''}</p>`:''}
    <div class="verdict ${v[0]}"><b>${R.days} days · about ${R.hours} study hours</b><span>${v[1]}</span>${R.gap>0?`<small>Rule of thumb: about 150–200 focused hours for +1 band, so +${R.gap.toFixed(1)} needs roughly ${R.needH} hours.</small>`:''}</div>
    <h3 style="font-size:16px">Your priority order</h3>
    <ol class="prio">${R.rank.map((k,i)=>`<li><b>${SK[k]}</b> <span class="note">${i===0?'main focus, 2 days a week + daily drill':i===1?'2 days a week':'1 day a week'}</span></li>`).join('')}</ol>
    <h3 style="font-size:16px">A typical weekday for you <span class="note" style="font-weight:500">(${sampleDay})</span></h3>
    <ul class="tasks">${sample.map(x=>`<li class="task"><div class="tx"><b>${esc(x.label)}</b><small>${esc(x.sub)}</small></div></li>`).join('')}</ul>
    <p class="note" style="margin:0">These are estimates from a short test. Your first full mock gives the real numbers, and you can redo this check any time in Settings.</p>
    ${wzNav('Start my plan')}`;
}
function finishWizard(){
  const d=WZ.d,R=WZ.R||estimate(d,WZ.t);
  const plan=Object.assign({},PLAN,{name:d.name.trim(),start:d.start,exam:d.exam,days:Number(d.days)||60,target:Number(d.target),
    profile:{purpose:d.purpose,type:d.type,minSkill:Number(d.minSkill)||0,mwd:Number(d.mwd),mwe:Number(d.mwe),when:d.when,
      prev:d.hasPrev?d.prev:null,conf:d.conf,problems:d.problems,est:R.est,rank:R.rank,test:R.sc,at:isoD(new Date())}});
  const err=planError(plan);if(err){toast(err);WZ.step=2;renderView();return;}
  buildSchedule(plan);touch('plan');WZ=null;sel=clampDay(todayIdx());haptic('ok');toast('Your plan is ready');tab='today';renderAll();scrollTo(0,0);
}
function wzValid(){
  const d=WZ.d,s=WSTEPS[WZ.step];
  if(s==='goal'&&!d.name.trim())return 'Please write your name';
  if(s==='time'){const e=planError({start:d.start,exam:d.exam,days:d.days});if(e)return e;}
  return '';
}
function playListening(){
  if(!ttsOK()||WZ.lPlays)return;
  const synth=window.speechSynthesis,voices=synth.getVoices().filter(v=>/^en/i.test(v.lang));
  const pick=re=>voices.find(v=>re.test(v.name))||null;
  const vW=pick(/female|samantha|serena|kate|libby|sonia|susan|zira|google uk english female/i)||voices[0]||null;
  const vM=pick(/male|daniel|arthur|ryan|george|david|google uk english male/i)||voices[1]||vW;
  WZ.lPlays=1;WZ.playing=true;renderView();
  LSCRIPT.forEach(([who,txt],i)=>{const u=new SpeechSynthesisUtterance(txt);u.lang='en-GB';u.rate=0.95;const v=who==='W'?vW:vM;if(v)u.voice=v;u.pitch=who==='W'?1.15:0.85;
    if(i===LSCRIPT.length-1)u.onend=()=>{WZ.playing=false;if(WSTEPS[WZ.step]==='test')renderView();};synth.speak(u);});
}

}
function renderAll(){renderHeader();renderTabs();renderView();document.getElementById('tabs').hidden=!PLAN||!!WZ;document.documentElement.style.setProperty('--target',`"${TARGET.toFixed(1)}"`);}

    return;}
  if((el=g('[data-wipe]'))){if(!wipeArm){wipeArm=true;openSettings();return;}wipe();closeSheet();tab='today';renderAll();scrollTo(0,0);toast('Everything deleted. Let\'s start again');return;}
  if((el=g('[data-nav]'))){const v=Number(el.dataset.nav);sel=v===0?clampDay(todayIdx()):clampDay(sel+v);haptic('sel');renderView();return;}

    const r=modsRef(goScopeKind(kind));r.m.extra=[...(r.m.extra||[]),{k:'x'+Date.now().toString(36),label,sub:nt.value.trim()}];r.commit();haptic('light');
    toast(kind==='week'?'Added to every week':editScope==='all'?'Added to every day':`Added to Day ${sel}`);renderHeader();renderView();const again=document.getElementById(`add-${kind}-name`);if(again)again.focus();return;}
  if(f.dataset.addword){const w=document.getElementById('nwW').value.trim();if(!w)return;
    S.words.push({id:'w'+Date.now().toString(36),w,m:document.getElementById('nwM').value.trim(),ex:document.getElementById('nwE').value.trim(),k:0});saveWords();haptic('ok');toast('Word saved');renderHeader();renderView();const again=document.getElementById('nwW');if(again)again.focus();}
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){for(const k in timers){clearTimeout(timers[k]);const o=getObj(k);if(o)put(k,JSON.stringify(o));}}else{renderHeader();}});

/* ---------- boot ---------- */
(async()=>{
  renderHeader();renderTabs();
  try{const r=await fetch('daily.json',{cache:'no-cache'});if(r.ok)DAILY=await r.json();}catch(e){}
  await load();
  if(PLAN)buildSchedule(PLAN);else{buildSchedule(planDefaults());PLAN=null;}
  sel=clampDay(todayIdx());
  renderAll();
  let last=todayIdx();setInterval(()=>{const t=todayIdx();if(t!==last){last=t;sel=clampDay(t);renderAll();}},60000);
})();
})();
</script>
