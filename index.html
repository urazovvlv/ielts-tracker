<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Road to 7.5</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@600;700&display=swap">
<style>
/* Layout: phone-first mini app — sticky header (day, level, streak), one scrolling view, bottom tab bar */
:root{
  --bg:#F2F4FA; --card:#FFFFFF; --sunk:#F6F8FC; --ink:#0D1A3A; --muted:#5B6890; --line:#DDE3F0;
  --navy:#1B3A8C; --navy-deep:#0E2160; --navy-soft:#E4EAF8; --gold:#C98A12; --gold-soft:#FBF0D7;
  --good:#1F8A5B; --bad:#C0392B;
  --ph1:#9DB4EA; --ph2:#5F82D9; --ph3:#2D4FA8; --ph4:#C98A12;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0A1124; --card:#121C36; --sunk:#0E1730; --ink:#E6ECF8; --muted:#8F9CBE; --line:#22304F;
  --navy:#7C9DF2; --navy-deep:#0B1A45; --navy-soft:#1A2850; --gold:#F0B947; --gold-soft:#2E2512;
  --good:#45C08A; --bad:#EE6B5C;
  --ph1:#2B3E73; --ph2:#3F5DB0; --ph3:#6E8FE6; --ph4:#F0B947;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body{padding-bottom:calc(74px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:var(--ink)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.note{font-size:12.5px;color:var(--muted)}
.wrap{padding:14px max(14px,env(safe-area-inset-left,0px)) 24px max(14px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;max-width:640px;margin:0 auto}

/* header */
.hdr{background:linear-gradient(135deg,var(--navy-deep),#1B3A8C 75%);color:#fff;padding:14px max(16px,env(safe-area-inset-left,0px)) 14px max(16px,env(safe-area-inset-right,0px));position:relative;overflow:hidden}
.hdr::after{content:none;position:absolute;right:-6px;bottom:-40px;font-family:var(--f-display);font-weight:800;font-size:130px;line-height:1;color:rgba(255,255,255,.07);pointer-events:none}
.hdr-in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:10px;position:relative;z-index:1}
.hdr-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hdr .eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.7);font-weight:700}
.hdr .day{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1.1}
.hdr .day small{font-size:15px;font-weight:700;opacity:.65}
.hdr .phase{font-size:13px;color:rgba(255,255,255,.8)}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.1);display:grid;place-items:center;color:#fff;flex:none}
.iconbtn svg{width:20px;height:20px}
.hdr-row{display:flex;gap:8px;align-items:center}
.lvl-sub{font-size:11.5px;color:rgba(255,255,255,.75)}
.lvl{flex:1;min-width:0;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:5px}
.lvl-top{display:flex;justify-content:space-between;font-size:12.5px;gap:8px}
.lvl-top b{font-family:var(--f-display);font-size:15px}
.hbar{height:7px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.hbar i{display:block;height:100%;background:#F0B947;border-radius:99px;transition:width .4s}
.streak{background:rgba(240,185,71,.16);border:1px solid rgba(240,185,71,.45);border-radius:12px;padding:6px 10px;text-align:center;min-width:64px}
.streak b{display:flex;align-items:center;justify-content:center;gap:3px;font-family:var(--f-display);font-size:20px;color:#F0B947;line-height:1.1}
.streak b svg{width:16px;height:16px}
.streak span{font-size:10.5px;color:rgba(255,255,255,.75)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:rgba(255,255,255,.75)}
.sync i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.5)}
.sync.ok i{background:#45C08A}.sync.busy i{background:#F0B947}.sync.err i{background:#EE6B5C}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card-h h2{font-size:18px}
.btn{border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:7px 12px;font-size:13.5px;font-weight:600;min-height:36px}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--card)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);font-weight:500;padding-left:0}
.btn.block{width:100%;min-height:44px;font-size:15px}
.btn.icon{width:36px;padding:0}
.daynav{display:flex;gap:6px;align-items:center}
.dayline{display:flex;align-items:center;gap:10px}
.badge-day{background:var(--navy-soft);color:var(--navy);border-radius:12px;padding:6px 10px;text-align:center;font-family:var(--f-display);font-weight:800;line-height:1.05;font-size:12px}
.badge-day b{display:block;font-size:22px}
.tag{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--gold-soft);color:var(--gold)}
.pline{display:flex;align-items:center;gap:10px}
.pbar{flex:1;height:8px;border-radius:99px;background:var(--navy-soft);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--navy);border-radius:99px;transition:width .3s}

/* tasks */
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.task{display:flex;gap:12px;align-items:center;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--sunk)}
.task input[type=checkbox]{appearance:none;-webkit-appearance:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--muted);flex:none;display:grid;place-items:center;margin:0;background:var(--card);cursor:pointer}
.task input[type=checkbox]:checked{background:var(--navy);border-color:var(--navy)}
.task input[type=checkbox]:checked::after{content:"";width:6px;height:11px;border:solid var(--card);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.task .tx{flex:1;min-width:0;cursor:pointer}
.task .tx b{display:block;font-weight:600}
.task .tx small{display:block;color:var(--muted);font-size:12.5px}
.task .xp{font-size:11px;font-weight:700;color:var(--gold);white-space:nowrap}
.task.done{background:var(--navy-soft);border-color:transparent}
.task.done .tx b{text-decoration:line-through;color:var(--muted)}
.task.main{border-left:4px solid var(--gold)}
.task.editing{background:var(--card);padding:8px}
.ef{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.ein{width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:7px 8px;font-weight:600}
.ein.sm{font-weight:400;font-size:13px}
.rm{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);font-size:18px;color:var(--muted);flex:none}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--sunk)}
.seg button{flex:1;border:0;background:none;padding:8px 6px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--navy);color:var(--card)}
.addrow{display:flex;flex-direction:column;gap:6px;padding:10px;border:1px dashed var(--navy);border-radius:12px;background:var(--navy-soft)}
.addrow input,.field input[type=text],.field input[type=search],textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 10px}
textarea{min-height:70px;resize:vertical;background:var(--sunk)}

/* inputs */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--sunk);overflow:hidden}
.stepper button{border:0;background:none;width:40px;height:42px;font-size:17px;font-weight:700;color:var(--navy);flex:none}
.stepper input{flex:1;min-width:0;border:0;background:none;text-align:center;font-size:17px;font-weight:700;height:42px;-moz-appearance:textfield}
.stepper input::-webkit-inner-spin-button,.stepper input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.mood{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.mood button{border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:6px 2px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center}
.mood button b{font-size:16px;color:var(--ink)}
.mood button.on{background:var(--navy);border-color:var(--navy);color:var(--card)}
.mood button.on b{color:var(--card)}

/* word of the day */
.wotd{background:var(--gold-soft);border-color:transparent}
.wotd .w{font-family:var(--f-display);font-size:22px;font-weight:800;line-height:1.15}
.wotd .uz{font-weight:600}
.wotd .ex{font-style:italic;color:var(--muted)}

/* stats & map */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.1}
.stat .v small{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:600;margin-left:3px}
.stat.hot{background:var(--gold-soft);border-color:transparent}
.stat.hot .v{color:var(--gold)}
.map{display:grid;grid-template-columns:28px repeat(7,minmax(0,1fr));gap:4px}
.map .wd{font-size:10px;font-weight:700;color:var(--muted);text-align:center}
.map .wk{font-size:10.5px;color:var(--muted);font-weight:700;display:flex;align-items:center}
.cell{position:relative;aspect-ratio:1/1;border-radius:8px;border:1px solid var(--line);background:var(--sunk);font-size:11px;font-weight:700;display:flex;align-items:flex-start;justify-content:flex-start;padding:3px 4px}
.cell.future{opacity:.5}
.cell.today{outline:2px solid var(--gold);outline-offset:1px}
.cell .mk{position:absolute;top:4px;right:4px;width:7px;height:7px;transform:rotate(45deg);background:var(--gold);border-radius:1px}
.cell .ph{position:absolute;left:4px;right:4px;bottom:3px;height:3px;border-radius:2px}
.cell.blank{visibility:hidden}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.chart svg{display:block;width:100%;height:auto}
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.bdg{border:1px dashed var(--line);border-radius:12px;padding:8px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);line-height:1.2}
.bdg svg{width:24px;height:24px}
.bdg b{font-size:12px}
.bdg.got{border-style:solid;border-color:var(--gold);background:var(--gold-soft);color:var(--ink)}

/* mocks */
.mock{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--sunk);display:flex;flex-direction:column;gap:8px}
.mock.next{border-color:var(--gold);background:var(--gold-soft)}
.mock-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mock-h small{display:block;color:var(--muted);font-size:12px}
.sc4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.sc4 label{display:flex;flex-direction:column;gap:3px;font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;text-align:center}
.sc{width:100%;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 2px;text-align:center;font-size:15px;font-weight:700;-moz-appearance:textfield}
.sc::-webkit-inner-spin-button{-webkit-appearance:none}
.bh{font-size:10.5px;font-weight:600;color:var(--muted);min-height:13px;text-transform:none;letter-spacing:0}
.pill{font-weight:800;font-size:15px;border-radius:99px;padding:4px 12px;background:var(--card);border:1px solid var(--line);color:var(--muted);font-family:var(--f-display)}
.pill.hit{background:var(--good);border-color:transparent;color:#fff}
.pill.c1{background:var(--navy);border-color:transparent;color:var(--card)}
.pill.low{color:var(--ink)}

/* words */
.wlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.witem{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line);border-radius:12px;background:var(--sunk)}
.witem .tx{flex:1;min-width:0}
.witem b{display:block}
.witem small{display:block;color:var(--muted);font-size:12.5px}
.known{font-size:10.5px;font-weight:700;color:var(--good)}
.pseg{margin-bottom:-4px}
.wtimer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--sunk)}
.wt{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--navy)}
.wt.over{color:var(--bad,#c0392b)}
.wt-btns{display:flex;gap:8px}
.wtext{width:100%;min-height:300px;font-size:16px;line-height:1.55;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);resize:vertical;font-family:inherit}
#wq8{width:100%;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-family:inherit;resize:vertical}
.wcount{font-size:13px;font-weight:700;color:var(--muted)}
.wcount.ok{color:var(--good)}
.wchecks{border:1px solid var(--line);border-radius:12px;padding:0 12px}
.wchecks summary{list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:48px;cursor:pointer}
.wchecks summary::-webkit-details-marker{display:none}
.wc-h{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:10px 0 2px}
.wc{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:14px;line-height:1.4}
.wc input{width:20px;height:20px;flex:none;margin-top:1px;accent-color:var(--navy)}
.wchecks[open]{padding-bottom:10px}
.elist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.essay{border:1px solid var(--line);border-radius:12px;background:var(--sunk)}
.essay summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;min-height:52px;cursor:pointer}
.essay summary::-webkit-details-marker{display:none}
.essay summary b{display:block}.essay summary small{display:block;color:var(--muted);font-size:12.5px}
.essay-q{margin:0 12px 8px;font-size:13px;color:var(--muted);font-style:italic}
.essay-t{margin:0 12px;white-space:pre-wrap;font-size:14.5px;line-height:1.55}
.essay-f{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px}
.essay-f .sc{width:76px}
.mtop{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.mtop li{display:flex;flex-direction:column;gap:4px}
.mtop-h{display:flex;align-items:center;gap:6px}
.mtop-n{margin-left:auto;font-weight:800;color:var(--navy);font-size:13px}
.mrow2{display:flex;gap:8px;align-items:center}
.mrow2 .sc{width:72px}
.mrow2 select{flex:1;min-height:44px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:0 10px}
.mgroup{display:flex;flex-direction:column;gap:6px}
.mgroup+.mgroup{margin-top:10px}
.duebox{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:12px;background:var(--navy-soft)}
.duebox b{font-size:26px;color:var(--navy);margin-right:6px}
.duebox span{font-weight:700}
.duebox small{display:block;color:var(--muted);font-size:12.5px}
.known.due{color:var(--navy)}
.qlist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;counter-reset:q}
.qlist button{width:100%;text-align:left;border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:11px 12px;font-size:15px;line-height:1.4;color:var(--ink);min-height:44px;font-family:inherit}
.qlist button.on{border-color:var(--navy);background:var(--navy-soft);font-weight:700}
.recbox{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--navy-soft)}
.recbox b{font-size:20px;color:var(--navy)}
.rec-l{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recdot{width:10px;height:10px;border-radius:50%;background:var(--bad);flex:none;display:inline-block}
.recbox .recdot{animation:recp 1s ease-in-out infinite}
@keyframes recp{50%{opacity:.25}}
.recbtn{display:flex;align-items:center;justify-content:center;gap:8px}
.recbtn .recdot{background:currentColor}
.recnote{margin:0;padding:10px 12px;border-radius:12px;background:var(--sunk)}
.rlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.rlist li{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--sunk);display:flex;flex-direction:column;gap:8px}
.rl-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.rl-h b{display:block;font-size:14px}
.rlist audio{width:100%;height:40px}
.svform{display:flex;flex-direction:column;gap:14px}
.svrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.svrow .sc{width:96px}
.svform textarea{width:100%;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-family:inherit;resize:vertical}
.svform .seg button{padding:10px 2px;font-size:12.5px}
.svsum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.svsum>div{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:12px;background:var(--sunk);text-align:center}
.svsum b{font-size:18px;color:var(--navy);line-height:1.2}
.svsum span{font-size:11px;color:var(--muted)}
.svt{display:flex;flex-direction:column;gap:2px;font-size:14px;line-height:1.45}
.wtag{display:inline-block;margin:4px 8px 0 0;font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.flash{border-radius:16px;padding:22px 16px;background:var(--navy);color:#fff;text-align:center;display:flex;flex-direction:column;gap:10px;min-height:170px;justify-content:center;cursor:pointer}
.flash .fw{font-family:var(--f-display);font-size:26px;font-weight:800}
.flash .fm{font-size:16px;font-weight:600}
.flash .fe{font-size:13.5px;opacity:.8;font-style:italic}
.flash .hint{font-size:12px;opacity:.65}

/* speaking timer */
.cue{background:var(--sunk);border:1px solid var(--line);border-radius:14px;padding:14px}
.cue h3{font-size:18px;margin-bottom:6px}
.cue ul{margin:6px 0 0;padding-left:18px;color:var(--muted)}
.ring{display:grid;place-items:center;position:relative;margin:4px auto 0;width:200px;max-width:70vw;aspect-ratio:1/1}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring>div{position:relative;max-width:66%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.ring .t{font-family:var(--f-display);font-size:40px;line-height:1.05;font-weight:800;font-variant-numeric:tabular-nums}
.ring .p{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);line-height:1.3}

/* tutor */
.wz{gap:14px}
.wz p{margin:0}
.wz h2{font-size:21px}
.wz-prog{display:flex;align-items:center;gap:10px}
.wz-nav{display:flex;justify-content:space-between;gap:10px;margin-top:4px}
.wz-nav .btn{min-height:44px;padding:0 18px;font-size:15px}
.wz-list{margin:0;padding-left:18px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.col{flex-direction:column;align-items:stretch}
.chip{border:1px solid var(--line);background:var(--sunk);border-radius:99px;padding:8px 13px;font-size:13.5px;font-weight:600;color:var(--ink);text-align:left}
.chips.col .chip{border-radius:12px}
.chip.on{background:var(--navy);border-color:var(--navy);color:var(--card)}
.skillbox{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--sunk)}
.skillbox .mood button{background:var(--card)}
.skillbox .mood button.on{background:var(--navy)}
.passage{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:14.5px;line-height:1.55}
.passage h3{font-size:16px}
.q{display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.lrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center;font-size:14px}
.rbars{display:flex;flex-direction:column;gap:9px}
.rb{display:grid;grid-template-columns:76px 1fr 34px;grid-template-rows:auto auto;column-gap:8px;align-items:center}
.rb-l{font-size:13px;font-weight:600}
.rb-t{position:relative;height:10px;border-radius:99px;background:var(--navy-soft)}
.rb-t i{display:block;height:100%;border-radius:99px;background:var(--navy)}
.rb-t i.ok{background:var(--good)}
.rb-t em{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--gold);border-radius:2px}
.rb b{font-family:var(--f-display);font-size:16px;text-align:right}
.rb small{grid-column:2/4;font-size:11px;color:var(--muted)}
.verdict{border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px;border:1px solid var(--line)}
.verdict.good{background:color-mix(in srgb,var(--good) 12%,var(--card));border-color:transparent}
.verdict.warn{background:var(--gold-soft);border-color:transparent}
.verdict.bad{background:color-mix(in srgb,var(--bad) 12%,var(--card));border-color:transparent}
.verdict small{color:var(--muted);font-size:12px}
.prio{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.empty{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:14px;border:1px dashed var(--line);border-radius:12px;background:var(--sunk)}
.sugg{display:block}
.sugg summary{cursor:pointer;display:flex;flex-direction:column;gap:2px;list-style:none}
.sugg summary::-webkit-details-marker{display:none}
.sugg[open] summary{margin-bottom:6px}
.skb{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.03em;padding:1px 6px;border-radius:6px;margin-right:6px;vertical-align:2px;color:#fff;font-family:var(--f-body)}
.sk-L{background:#2D6BD8}.sk-R{background:#1F8A5B}.sk-W{background:#C98A12}.sk-S{background:#8A4FC8}.sk-V{background:#5B6890}.sk-G{background:#B8456B}
.bals{display:flex;flex-wrap:wrap;gap:6px}
.bal{display:inline-flex;align-items:center;font-size:12.5px;padding:4px 8px 4px 4px;border-radius:99px;border:1px solid var(--line);background:var(--sunk);gap:2px}
.bal b{margin-left:4px}
.bal.zero{opacity:.55}
.bal.full{border-color:var(--good)}
.warn{list-style:none;margin:0;padding:10px 12px;border-radius:12px;background:var(--gold-soft);display:flex;flex-direction:column;gap:6px;font-size:13px}
.warn li{display:flex;align-items:flex-start;gap:2px}
.plan-in{display:flex;flex-direction:column;margin-top:10px}
/* iPhone zooms into fields under 16px */
input[type=text],input[type=search],input[type=date],input[type=number],select,textarea,.ein,.ein.sm,.sc{font-size:16px}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(6px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-right,0px));z-index:10}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0;border-radius:10px}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--navy)}
.tabs button.on svg{stroke-width:2.4}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(5,10,25,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px max(14px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.idbox{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.idbox code{flex:1;font-size:18px;font-weight:700;letter-spacing:.03em}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:30;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== Design system v2: one type scale, 8-pt spacing, 44 px tap targets (Telegram + mobile UI guidelines) ===== */
:root{--fs-xl:28px;--fs-l:20px;--fs-m:16px;--fs-s:13px;--fs-xs:11px;--sp:8px}
body{font-size:var(--fs-m)}
.wrap{padding-top:16px;padding-bottom:24px;gap:16px}
.card{padding:16px;gap:16px;border-radius:16px}
.card-h h2,.wz h2{font-size:var(--fs-l);line-height:1.2}
h3{font-size:var(--fs-m)}
.note{font-size:var(--fs-s);line-height:1.4}
.label{font-size:var(--fs-xs)}
/* header: shorter, status moved to the top row */
.hdr{padding-top:12px;padding-bottom:16px}
.hdr-in{gap:12px}
.hdr-top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:24px}
.hdr .eyebrow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .sync{font-size:var(--fs-xs);white-space:nowrap}
.hdr-day .day{font-size:var(--fs-xl);line-height:1.1}
.hdr-day .phase{font-size:var(--fs-s)}
.iconbtn{width:44px;height:44px}
.lvl{padding:12px;gap:8px;border-radius:14px}
.lvl-top b{font-size:var(--fs-m)}
.lvl-top span{font-size:var(--fs-s)}
/* controls: at least 44 px */
.btn{min-height:44px;padding:10px 16px;font-size:15px;border-radius:12px}
.btn.icon{width:44px;height:44px;padding:0;font-size:18px}
.btn.ghost{min-height:44px}
.rm{width:44px;height:44px;border-radius:12px}
.chip{min-height:44px;padding:10px 14px;font-size:14px}
.seg button{min-height:44px;font-size:14px}
.stepper button{width:44px;height:44px}
.tabs button{min-height:52px;font-size:var(--fs-xs)}
/* day card */
.badge-day{padding:8px 10px;border-radius:12px}
.tag{font-size:var(--fs-xs);padding:3px 8px}
.pline .label{min-width:72px}
.tasks{gap:8px}
.task{min-height:56px;padding:12px 14px;gap:12px;border-radius:14px}
.task input[type=checkbox]{width:26px;height:26px}
.task .tx b{font-size:var(--fs-m);line-height:1.3}
.task .tx small{font-size:var(--fs-s);margin-top:2px}
.bals{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.bals::-webkit-scrollbar{display:none}
.bal{flex:1 1 0;min-width:0;justify-content:center;padding:4px 6px 4px 4px;font-size:var(--fs-s);min-height:32px;white-space:nowrap}
.bal .skb{margin-right:4px}
.warn{padding:12px;gap:8px;font-size:var(--fs-s);border-radius:12px}
.empty{padding:16px;gap:8px;border-radius:14px}
/* edit mode: name on its own row, note + skill side by side */
.task.editing{padding:8px;align-items:flex-start}
.task.editing .ef{display:grid;grid-template-columns:1fr 128px;gap:8px}
.task.editing .ef .ein:first-child{grid-column:1/-1}
.addrow{padding:12px;gap:8px;border-radius:14px}
.tg-main .edit-done{display:none}
/* mocks */
.mock{padding:12px;gap:12px;border-radius:14px}
.sc{min-height:44px}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:56px;padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);text-align:left;color:var(--ink)}
.mrow span{display:flex;flex-direction:column;gap:2px;min-width:0}
.mrow b{font-size:15px}
.mrow small{color:var(--muted);font-size:var(--fs-s)}
.mrow-go{font-size:22px;color:var(--muted);flex-direction:row!important}
.card>.mrow+.mrow,.card>.mock+.mrow,.card>.mrow+.mock{margin-top:-8px}
/* progress */
.stat{padding:12px;gap:4px;border-radius:14px}
.stat .v{font-size:26px}
.cell{border-radius:8px}
/* settings sheet */
.sheet{gap:16px;padding-top:16px}
.sugg summary{min-height:44px;justify-content:center}
.band-now{display:flex;align-items:baseline;gap:10px}
.band-now b{font-family:var(--f-display);font-size:40px;line-height:1;color:var(--navy)}
.band-now span{font-size:var(--fs-s);color:var(--muted);font-weight:600}
.band-bar{height:10px;border-radius:99px;background:var(--navy-soft);overflow:hidden}
.band-bar i{display:block;height:100%;border-radius:99px;background:var(--gold)}
.band-parts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.band-parts>span{display:flex;align-items:center;justify-content:center;gap:4px;padding:8px 4px;border:1px solid var(--line);border-radius:12px;background:var(--sunk);font-size:15px}
.stats{grid-template-columns:repeat(3,minmax(0,1fr))}
.stats .stat .note{font-size:var(--fs-xs)}
.stats .stat .v{font-size:24px}
.dsec{gap:0;padding:0;overflow:hidden}
.dsec summary{list-style:none;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:14px 16px;min-height:56px}
.dsec summary::-webkit-details-marker{display:none}
.dsec[open] summary{border-bottom:1px solid var(--line)}
.dsec-t{display:flex;align-items:center;gap:4px}
.dsec-t b{font-size:var(--fs-m)}
.dsec-ok{margin-left:auto;color:var(--good);font-weight:800}
.dsec.done{border-color:color-mix(in srgb,var(--good) 50%,var(--line))}
.dsec>.btn{margin:12px 16px 16px;width:calc(100% - 32px)}
.dlist{margin:0;padding:4px 16px 0 36px;display:flex;flex-direction:column}
.di{padding:12px 0;border-bottom:1px solid var(--line);display:list-item}
.di>*+*{margin-top:4px}
.di:last-child{border-bottom:0}
.di::marker{color:var(--muted);font-weight:700;font-size:var(--fs-s)}
.di-h{display:flex;align-items:flex-start;gap:8px}
.di-h b{flex:1;font-size:var(--fs-m);line-height:1.35}
.di-pos{font-size:var(--fs-xs);color:var(--muted);font-style:italic;padding-top:3px}
.di-btn{flex:none;width:36px;height:36px;margin:-6px -4px -6px 0;border-radius:10px;border:1px solid var(--line);background:var(--sunk);font-size:16px;font-weight:700;color:var(--navy)}
.di-btn.on{background:var(--navy-soft);color:var(--good)}
.di-ipa{font-family:ui-monospace,Menlo,monospace;font-size:var(--fs-s);color:var(--navy)}
.di-syn{font-size:var(--fs-s);color:var(--muted)}
.di-uz{font-size:15px;font-weight:600}
.di-ex{font-size:var(--fs-s);font-style:italic;color:var(--muted)}
.di-use{font-size:var(--fs-xs);color:var(--navy);font-weight:600;background:var(--navy-soft);padding:3px 8px;border-radius:6px;align-self:flex-start}
.tabs button{font-size:10.5px}

/* ===== Design system v3 — "Night shift": midnight navy instrument panel, teal for progress, one bold moment (the 60-day ruler) ===== */
:root{
  --bg:#F2F4FA; --card:#FFFFFF; --sunk:#F3F6FC; --raised:#E8EDF8; --ink:#0B1533; --muted:#5B688C; --line:#E0E6F2;
  --navy:#2146C7; --action:#1F45C7; --navy-deep:#0A1638; --navy-soft:#E7EDFC;
  --teal:#0B9486; --teal-soft:#DCF3F0; --gold:#B7791F; --gold-soft:#FBF1DE;
  --good:#0B9486; --bad:#D64545;
  --ph1:#9FB4F0; --ph2:#5F82E6; --ph3:#2146C7; --ph4:#0B9486;
  --f-display:"Unbounded","Onest",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-card:20px; --r-item:14px; --r-ctl:12px;
  --shadow:0 1px 2px rgba(10,22,56,.05),0 6px 24px -12px rgba(10,22,56,.12);
  --hdr-glow:rgba(70,110,255,.55);
}
:root[data-theme="dark"]{
  --bg:#070D1F; --card:#0E1630; --sunk:#0A1229; --raised:#16203F; --ink:#E9EEFB; --muted:#8B98BE; --line:#1B2647;
  --navy:#7D9BFF; --action:#3B63E6; --navy-deep:#050A18; --navy-soft:#15204A;
  --teal:#2DD4BF; --teal-soft:#0D2C33; --gold:#F2B84B; --gold-soft:#29210F;
  --good:#2DD4BF; --bad:#FF6B6B;
  --ph1:#22305E; --ph2:#34509E; --ph3:#5B82FF; --ph4:#2DD4BF;
  --shadow:none;
  --hdr-glow:rgba(59,99,230,.38);
}
html,body{font-family:var(--f-body);letter-spacing:-.003em}
body{font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-body);font-weight:700;letter-spacing:-.015em}
::selection{background:color-mix(in srgb,var(--teal) 35%,transparent)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

/* labels: sentence case, quiet */
.label,.sc4 label,.wc-h,.ring .p,.wtag,.hdr .eyebrow{text-transform:none;letter-spacing:0}
.label{font-size:13px;font-weight:600;color:var(--muted)}
.note{color:var(--muted)}

/* header: deep navy panel with the 60-day ruler */
.hdr{background:radial-gradient(120% 160% at 100% -20%,var(--hdr-glow),transparent 58%),var(--navy-deep);padding:14px max(18px,env(safe-area-inset-left,0px)) 18px max(18px,env(safe-area-inset-right,0px));border-bottom:1px solid rgba(255,255,255,.06)}
.hdr-in{gap:10px}
.hdr .eyebrow{font-size:14px;font-weight:600;color:rgba(255,255,255,.72)}
.hdr-day{display:flex;flex-direction:column;gap:6px}
.hdr .day,.hdr-day .day{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1;letter-spacing:-.02em;color:#fff}
.hdr .day small{font-family:var(--f-body);font-size:16px;font-weight:600;color:rgba(255,255,255,.55);letter-spacing:0;margin-left:2px}
.hdr .phase,.hdr-day .phase{display:flex;align-items:center;gap:8px;font-size:14px;color:rgba(255,255,255,.78)}
.ph-chip{font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:rgba(255,255,255,.1);color:#fff}
.sync{padding:4px 9px 4px 8px;border-radius:99px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.8)}
.sync.ok i{background:#2DD4BF}.sync.busy i{background:#F2B84B}.sync.err i{background:#FF6B6B}
.iconbtn{border-radius:12px;border-color:rgba(255,255,255,.14);background:rgba(255,255,255,.07)}
.ruler{display:flex;gap:2px;height:14px;align-items:flex-end;margin-top:6px}
.ruler i{flex:1;min-width:0;height:8px;border-radius:2px;background:rgba(255,255,255,.14);transform-origin:bottom}
.ruler i.past{background:#2DD4BF;opacity:.85}
.ruler i.now{height:14px;background:#fff;box-shadow:0 0 0 2px rgba(45,212,191,.35)}
.ruler i.mk:not(.past):not(.now){background:rgba(45,212,191,.45)}
@media (prefers-reduced-motion:no-preference){
  .ruler.anim i{animation:tick .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 6ms)}
  @keyframes tick{from{transform:scaleY(0)}to{transform:scaleY(1)}}
}

/* surfaces */
.wrap{gap:14px;padding-top:16px}
.card{border-radius:var(--r-card);border:1px solid var(--line);box-shadow:var(--shadow);padding:18px;gap:16px}
:root[data-theme="dark"] .card{border-color:transparent;background:linear-gradient(180deg,color-mix(in srgb,var(--card) 100%,#fff 2%),var(--card))}
.card-h h2,.wz h2,.card>h2{font-size:20px}
.task,.witem,.mrow,.qlist button,.essay,.rlist li,.stat,.mock,.cue,.wtimer,.empty,.recnote,.svsum>div,.band-parts>span,.passage,.idbox{border-radius:var(--r-item)}
.task,.witem,.mrow,.essay,.rlist li,.stat,.mock,.cue,.wtimer,.band-parts>span,.svsum>div,.qlist button{background:var(--sunk);border-color:var(--line)}
:root[data-theme="dark"] .task,:root[data-theme="dark"] .witem,:root[data-theme="dark"] .mrow,:root[data-theme="dark"] .essay,:root[data-theme="dark"] .rlist li,:root[data-theme="dark"] .stat,:root[data-theme="dark"] .mock,:root[data-theme="dark"] .cue,:root[data-theme="dark"] .wtimer,:root[data-theme="dark"] .band-parts>span,:root[data-theme="dark"] .qlist button{border-color:transparent;background:var(--raised)}
.empty{border-style:dashed;background:transparent}

/* buttons */
.btn{border-radius:var(--r-ctl);font-weight:600;min-height:46px;background:var(--raised);border-color:transparent;color:var(--ink);transition:transform .12s ease,background .15s ease}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--action);border-color:var(--action);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.btn.primary:disabled{opacity:.55}
.btn.ghost{background:none;color:var(--muted)}
.btn.block{min-height:50px;font-size:16px}
.btn.icon{background:var(--raised)}
.rm{background:transparent;border-color:var(--line);color:var(--muted)}
.chip{background:var(--sunk);border-color:var(--line);border-radius:99px;font-weight:600}
.chip.on{background:var(--action);border-color:var(--action);color:#fff}
.seg{background:var(--raised);border:0;border-radius:14px;padding:4px;gap:4px}
.seg button{border-radius:10px;color:var(--muted);min-height:40px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(10,22,56,.12)}
:root[data-theme="dark"] .seg button.on{background:#26325E;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.addrow{border:1px dashed color-mix(in srgb,var(--navy) 45%,transparent);background:color-mix(in srgb,var(--navy-soft) 60%,transparent);border-radius:var(--r-item)}
.addrow input,.field input[type=text],.field input[type=search],textarea,.sc,.ein,#wq8,.wtext,.mrow2 select,.svform textarea{background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--ink)}
:root[data-theme="dark"] .addrow input,:root[data-theme="dark"] .field input[type=text],:root[data-theme="dark"] .field input[type=search],:root[data-theme="dark"] textarea,:root[data-theme="dark"] .sc,:root[data-theme="dark"] .ein,:root[data-theme="dark"] #wq8,:root[data-theme="dark"] .wtext,:root[data-theme="dark"] .mrow2 select,:root[data-theme="dark"] .svform textarea{background:var(--sunk)}
input::placeholder,textarea::placeholder{color:color-mix(in srgb,var(--muted) 75%,transparent)}

/* day card */
.badge-day{background:var(--navy-soft);color:var(--navy);font-family:var(--f-body);font-weight:600;font-size:12px;border-radius:14px;padding:8px 12px}
.badge-day b{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.1}
.tag{background:var(--teal-soft);color:var(--teal);font-weight:600}
.pbar,.band-bar{background:var(--raised);height:8px}
.pbar i,.band-bar i{background:linear-gradient(90deg,var(--teal),color-mix(in srgb,var(--teal) 70%,#7D9BFF))}
.task{transition:background .15s ease,opacity .15s ease}

<script>
(function(){

const fmt=d=>`${WD[(d.getDay()+6)%7]} ${d.getDate()} ${MON[d.getMonth()]}`;

  const out=[];
  for(let k=unlockedPacks();k>=1;k--){const p=DPACK[k];if(!p)continue;const dk=dayDoc(k).dk||{};
    for(const [sec] of DSEC){((p[sec]&&p[sec].items)||[]).forEach((x,i)=>{
      out.push(Object.assign({id:`d${k}:${sec}:${i}`,w:sec==='idioms'?x.t:(sec==='speaking'||sec==='grammar')?x.s:x.w,m:x.uz||'',ex:x.ex||x.tip||'',syn:x.syn&&x.syn!=='—'?x.syn:'',ipa:x.ipa||'',sec,day:k},srsDaily(k,dk[sec+':'+i])));});}}
  return out;
}
function wordPool(){
  const mine=S.words.slice().reverse().map(w=>Object.assign({},w,srsOwn(w)));
  if(wFilter==='mine')return mine;
  const d=dailyWords();
  return wFilter==='all'?mine.concat(d):d.filter(x=>x.sec===wFilter);
}
function searchWords(pool){const qy=wordQuery.trim().toLowerCase();return qy?pool.filter(w=>w.w.toLowerCase().includes(qy)||(w.m||'').toLowerCase().includes(qy)||(w.syn||'').toLowerCase().includes(qy)):pool;}
function findWord(id){if(/^d\d/.test(id))return dailyWords().find(x=>x.id===id)||null;const w=S.words.find(x=>x.id===id);return w?Object.assign({},w,srsOwn(w)):null;}

let SPK={part1:[],part3:[]},spPart=2,spT=0,spQ=0;
async function loadSpeaking(){try{const r=await fetch('speaking.json',{cache:'no-cache'});if(r.ok)SPK=await r.json();}catch(e){}spT=Math.floor(Math.random()*Math.max(1,(SPK.part1||[]).length));}
const MIC=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);
let recAuto=(()=>{try{return localStorage.getItem('r75pref:recauto')!=='0';}catch(e){return true;}})();
let rec={state:'idle',err:'',start:0,label:'',part:0,mr:null,stream:null,chunks:[],dur:0},recs=[],recLoaded=false,recTick=null;
const mmss=ms=>{const s=Math.max(0,Math.round(ms/1000));return `${Math.floor(s/60)}:${pad(s%60)}`;};
function recMime(){for(const t of ['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus'])try{if(MediaRecorder.isTypeSupported(t))return t;}catch(e){}return '';}
async function micStream(){if(rec.stream&&rec.stream.getAudioTracks().some(t=>t.readyState==='live'))return rec.stream;rec.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});return rec.stream;}
function micRelease(){if(rec.stream){try{rec.stream.getTracks().forEach(t=>t.stop());}catch(e){}rec.stream=null;}}
const speakRerender=()=>{if(onSpeak())renderView();};
async function recStart(part,label){
  if(rec.state!=='idle')return;
  if(!MIC){rec.err='nomic';speakRerender();return;}
  rec.state='starting';
  try{const st=await micStream(),mt=recMime(),mr=new MediaRecorder(st,mt?{mimeType:mt}:undefined);
    rec.chunks=[];mr.ondataavailable=e=>{if(e.data&&e.data.size)rec.chunks.push(e.data);};
    mr.onstop=()=>recSave(mr.mimeType||mt||'audio/webm');
    mr.start(1000);Object.assign(rec,{state:'rec',err:'',start:Date.now(),label,part,mr});haptic('medium');
    clearInterval(recTick);recTick=setInterval(()=>{if(rec.state!=='rec'){clearInterval(recTick);return;}const el=document.getElementById('recT');if(el)el.textContent=mmss(Date.now()-rec.start);if(Date.now()-rec.start>5*60000)recStop();},250);}
  catch(e){rec.err=e&&(e.name==='NotAllowedError'||e.name==='SecurityError')?'denied':'fail';rec.state='idle';micRelease();}
  speakRerender();
}
function recStop(){if(rec.state!=='rec'||!rec.mr)return;rec.dur=Date.now()-rec.start;rec.state='saving';clearInterval(recTick);try{rec.mr.stop();}catch(e){rec.state='idle';micRelease();}haptic('light');}
async function recSave(type){
  const blob=new Blob(rec.chunks,{type}),part=rec.part;micRelease();
  const item={id:'r'+Date.now().toString(36),part,label:rec.label,ts:Date.now(),dur:rec.dur||0,type,blob};
  rec.state='idle';rec.mr=null;rec.chunks=[];
  if(blob.size){recs.unshift(Object.assign({url:URL.createObjectURL(blob)},item));await idbPut(item);
    if(recs.length>30){for(const o of recs.splice(30)){try{URL.revokeObjectURL(o.url);}catch(e){}idbDel(o.id);}}
    toast('Recording saved');haptic('ok');
    if(part===1){const n=((SPK.part1[spT]||{}).q||[]).length;if(n)spQ=Math.min(spQ+1,n-1);}
    if(part===3){const n=(SPK.part3[timer.cue]||[]).length;if(n)spQ=Math.min(spQ+1,n-1);}}
  speakRerender();
}
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open('r75rec',1);r.onupgradeneeded=()=>r.result.createObjectStore('rec',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}});}
async function idbPut(x){try{const db=await idb();await new Promise((res,rej)=>{const t=db.transaction('rec','readwrite');t.objectStore('rec').put(x);t.oncomplete=res;t.onerror=()=>rej(t.error);});}catch(e){}}
async function idbDel(id){try{const db=await idb();await new Promise(res=>{const t=db.transaction('rec','readwrite');t.objectStore('rec').delete(id);t.oncomplete=res;t.onerror=res;});}catch(e){}}
async function idbAll(){try{const db=await idb();return await new Promise((res,rej)=>{const r=db.transaction('rec').objectStore('rec').getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);});}catch(e){return [];}}
async function loadRecs(){if(recLoaded)return;recLoaded=true;const all=await idbAll();
  recs=all.filter(x=>x&&x.blob).sort((a,b)=>b.ts-a.ts).map(x=>Object.assign({url:URL.createObjectURL(x.blob)},x));if(recs.length)speakRerender();}
function recBlock(part,label){
  if(!MIC)return `<p class="note recnote">Recording does not work inside this version of Telegram. Answer out loud and record a voice message to yourself in Saved Messages instead.</p>`;
  const err=rec.err==='denied'?'Microphone access is blocked. Allow the microphone for Telegram in your phone settings (Settings → Telegram → Microphone), then try again.':rec.err?'Could not start recording on this device.':'';
  if(rec.state==='rec'&&rec.part===part)return `<div class="recbox"><span class="recdot" aria-hidden="true"></span><b class="num" id="recT">${mmss(Date.now()-rec.start)}</b><span class="note rec-l">${esc(rec.label)}</span><button class="btn primary" data-rec="stop">Stop</button></div>`;
  if(rec.state==='rec')return `<p class="note recnote">Recording another answer…</p>`;
  return `${err?`<p class="note recnote">${err}</p>`:''}<button class="btn block primary recbtn" data-rec="start" data-part="${part}" data-label="${esc(label)}" ${rec.state!=='idle'?'disabled':''}><span class="recdot" aria-hidden="true"></span>Record my answer</button>`;
}
function recList(){
  return `<section class="card"><div class="card-h"><h2>My recordings</h2><span class="note">${recs.length} on this phone</span></div>
  ${recs.length?`<ul class="rlist">${recs.map(r=>`<li><div class="rl-h"><div><b>${esc(r.label)}</b><small class="note">${fmt(new Date(r.ts))} · ${mmss(r.dur)}</small></div><button class="rm" data-rdel="${r.id}" aria-label="Delete recording">×</button></div><audio controls preload="metadata" src="${r.url}"></audio></li>`).join('')}</ul>`
  :'<p class="note" style="margin:0">Your answers appear here. Listen back for long pauses, repeated words and grammar slips. The last 30 recordings are kept on this phone only.</p>'}</section>`;
}
function qList(qs,part){return `<ol class="qlist">${qs.map((q,i)=>`<li><button type="button" class="${i===spQ?'on':''}" data-spq="${i}" aria-pressed="${i===spQ}">${esc(q)}</button></li>`).join('')}</ol>`;}

  <div class="ring" id="ring">${ringSvg()}<div><div class="t" id="tt">${timeLeftText()}</div><div class="p" id="tp">${phaseText()}</div></div></div>
  ${rec.state==='rec'&&rec.part===2?`<div class="recbox"><span class="recdot" aria-hidden="true"></span><b class="num" id="recT">${mmss(Date.now()-rec.start)}</b><span class="note rec-l">Recording your answer</span></div>`:''}

function timeLeft(){if(timer.phase==='prep'||timer.phase==='speak')return Math.max(0,timer.end-Date.now());if(timer.phase==='done')return 0;return 60000;}
const timeLeftText=()=>{const s=Math.ceil(timeLeft()/1000);return `${Math.floor(s/60)}:${pad(s%60)}`;};
const phaseText=()=>({idle:'1 min prepare · 2 min speak',prep:'Prepare · make notes',speak:'Speak now',done:'Time is up'})[timer.phase];
function ringSvg(){
  const r=44,C=2*Math.PI*r,p=(timer.phase==='prep'||timer.phase==='speak')?timeLeft()/timer.dur:(timer.phase==='done'?0:1);
  const col=timer.phase==='speak'?'var(--gold)':'var(--navy)';
  return `<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--navy-soft)" stroke-width="7"/><circle id="rc" cx="50" cy="50" r="${r}" fill="none" stroke="${col}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}"/></svg>`;
}
function timerCtrls(){
  if(timer.phase==='idle')return '<button class="btn block primary" data-timer="start">Start: 1 min prepare</button>';
  if(timer.phase==='prep')return '<div class="grid2"><button class="btn block" data-timer="reset">Reset</button><button class="btn block primary" data-timer="speak">Start speaking now</button></div>';
  if(timer.phase==='speak')return '<button class="btn block" data-timer="reset">Stop</button>';
  return `<div class="grid2"><button class="btn block" data-timer="reset">Again</button><button class="btn block primary" data-cue="next">New card</button></div>`;
}
let tick=null;
function startPhase(ph,ms){if(ph==='speak'&&recAuto&&MIC&&rec.state==='idle'&&tab==='speak'&&pSeg==='speak'&&spPart===2)recStart(2,'Part 2 · '+CUES[timer.cue][0]);timer.phase=ph;timer.dur=ms;timer.end=Date.now()+ms;haptic('medium');clearInterval(tick);tick=setInterval(timerTick,200);if(onSpeak())renderView();}
function timerTick(){
  if(timer.phase!=='prep'&&timer.phase!=='speak'){clearInterval(tick);return;}
  if(timeLeft()<=0){if(timer.phase==='prep'){startPhase('speak',120000);return;}timer.phase='done';clearInterval(tick);if(rec.part===2)recStop();haptic('ok');if(onSpeak())renderView();return;}
  if(!onSpeak())return;
  const tt=document.getElementById('tt');if(tt)tt.textContent=timeLeftText();
  const rc=document.getElementById('rc');if(rc){const C=2*Math.PI*44;rc.setAttribute('stroke-dashoffset',C*(1-timeLeft()/timer.dur));}
}

const DRILLS={
  L:{spelling:'Dictation: 10 names, numbers and dates, then check spelling',speed:'Shadowing: repeat a 2-minute BBC clip at full speed',maps:'One map or plan task + direction words (opposite, next to…)',distract:'Sections 1–2: mark every place a speaker changes an answer',focus:'Section 4 lecture: note-taking practice, then answer'},
  R:{time:'One passage in exactly 18 minutes, no extra time',tfng:'15 True / False / Not Given statements, explain each answer',headings:'Matching headings: one passage, read first sentences only',vocab:'Paraphrase hunt: find 10 word pairs in a passage',long:'Skim three passages, 3 minutes each, main idea only'},
  W:{ideas:'Plan three Task 2 questions, 5 minutes each (ideas only)',grammar:'Rewrite 5 of your sentences using complex structures',overview:'Write only the overview for two Task 1 charts',coherence:'One body paragraph: idea → explanation → example',time:'Timed: Task 2 intro + one body paragraph in 15 minutes'},
  S:{fluency:'Talk for 2 minutes non-stop on a random topic, recorded',vocab:'Learn 5 natural phrases for one Part 1 topic and use them',pron:'Shadow a 1-minute clip, copying stress and intonation',part2:'Part 2 card: 1 min notes, then a full 2-minute talk',ideas:'Answer 4 Part 3 questions: opinion + reason + example'}
};
const MAINS={
  full:{L:[['Listening: full test, 4 sections + transcript check',45],['Listening: Sections 3–4 twice + dictation',40]],
        R:[['Reading: full test, 60 minutes',60],['Reading: one passage for each question type you find hard',45]],
        W:[['Writing Task 2 essay, 40 minutes',45],['Writing Task 1 report, 20 minutes + rewrite',35]],
        S:[['Speaking: full test recorded (Parts 1–3)',30],['Speaking: three Part 2 cards + Part 3 questions',30]]},
  short:{L:[['Listening: two sections + transcript check',20]],R:[['Reading: one passage in 20 minutes',20]],
        W:[['Writing: Task 2 plan + one body paragraph',20]],S:[['Speaking: two Part 2 cards, recorded',20]]}
};
/* Same rotation as reminders.py: weakest skill twice, second twice, third and fourth once, Sunday review. */
const ROTA=[0,1,2,0,1,3,-1];
function mainFor(n,p){
  const wd=(dateOf(n).getDay()+6)%7,mins=wd>=5?p.mwe:p.mwd;
  if(MOCKS[n])return {label:`Full mock · ${MOCKS[n]}`,sub:mins<150?'About 2 h 45 min. Short on time? Do Listening + Reading today, Writing + Speaking tomorrow.':'L 30 · R 60 · W 60 · S 15 min, exam conditions',m:165};
  const r=ROTA[wd];if(r<0)return {label:'Weekly review: redo this week\'s mistakes',sub:'Then plan next week',m:30};
  const sk=p.rank[r],v=ROTA.slice(0,wd).filter(x=>x===r).length,set=mins<60?MAINS.short:MAINS.full,opt=set[sk][Math.min(v,set[sk].length-1)];
  return {label:opt[0],sub:`${SK[sk]} focus`,m:opt[1],sk};
}
function genTasks(n,p){
  const wd=(dateOf(n).getDay()+6)%7,M=wd>=5?p.mwe:p.mwd,mn=mainFor(n,p);
  const out=[{k:'main',label:mn.label,sub:`${mn.sub} · ~${mn.m} min`,main:true}];let used=mn.m;
  const probs=sk=>(p.problems&&p.problems[sk]&&p.problems[sk].length?p.problems[sk]:PROBLEMS[sk].map(x=>x[0]));
  const drill=(sk,i)=>{const ps=probs(sk);return DRILLS[sk][ps[(n+i)%ps.length]];};
  const add=(k,label,why,m,cond)=>{if(cond===false||used+m>M+10)return;out.push({k,label,sub:`${why} · ~${m} min`});used+=m;};
  const pos=sk=>p.rank.indexOf(sk);
  add('words',M<60?'10 new words in Anki':'20 new words in Anki','Collocations, not single words',M<60?10:15);
  add('drill',drill(p.rank[0],0),`${SK[p.rank[0]]} is your weakest skill`,15);
  add('speak','Speaking: one Part 2 recording','Listen back for pauses and mistakes',10,mn.sk!=='S'&&pos('S')<=2);
  add('grammar','Grammar: 15 min on one error type','Pick it from your mistake log',15,pos('W')<=1||pos('S')<=1);
  add('listen','Listening section + transcript','Find why each answer was missed',20,mn.sk!=='L'&&pos('L')<=2);
  add('drill2',drill(p.rank[1],1),`${SK[p.rank[1]]} practice`,15);
  out.push({k:'log',label:'Mistake log updated',sub:'One line per error, type + fix · ~5 min'});
  return out;
}

const norm=s=>String(s||'').toLowerCase().replace(/[\s,]/g,'').replace(/[^a-z0-9.:£]/g,'');
const ttsOK=()=>'speechSynthesis' in window&&typeof SpeechSynthesisUtterance!=='undefined';
function scoreTest(t){
  const g=t.g?GQ.filter((q,i)=>t.g[i]===q[2]).length:null;
  const r=t.r?RQ.filter((q,i)=>{const v=t.r[i];if(q.t==='gap')return q.a.includes(norm(v));return v===q.a;}).length:null;
  const l=t.l?LQ.filter((q,i)=>{const v=norm(t.l[i]);return q.a.includes(v)||q.a.includes(v.replace(/^£/,'').replace(/pounds?$/,''));}).length:null;
  return {g,r,l};
}
const half=x=>Math.round(x*2)/2;
const clampB=x=>Math.max(3.5,Math.min(9,x));
function estimate(d,t){
  const sc=scoreTest(t),conf={1:4.5,2:5,3:5.5,4:6,5:6.5},prev=d.hasPrev?d.prev:null,est={},src={};
  for(const k of ['L','R','W','S']){
    let base=conf[d.conf[k]||3];src[k]='self-check';
    if(prev&&prev[k]){base=Number(prev[k]);src[k]='previous IELTS';}
    est[k]=base;
  }
  if(sc.r!=null&&t.rDone){const b=toBand(Math.round(sc.r/8*40),RB);est.R=prev&&prev.R?half((b+Number(prev.R))/2):b;src.R='placement test';}
  if(sc.l!=null&&t.lDone){const b=Math.min(7,toBand(Math.round(sc.l/6*40),LB));est.L=prev&&prev.L?half((b+Number(prev.L))/2):b;src.L='placement test';}
  if(sc.g!=null&&t.gDone){const adj=sc.g>=9?0.5:sc.g<=5?-0.5:0;for(const k of ['W','S'])if(!(prev&&prev[k]))est[k]=est[k]+adj;}
  for(const k in est)est[k]=clampB(half(est[k]));
  const overallNow=half((est.L+est.R+est.W+est.S)/4);
  const target=Number(d.target)||7,need=Math.max(Number(d.minSkill)||0,0);
  const gapOf=k=>Math.max(target,need)-est[k];
  const rank=['L','R','W','S'].sort((a,b)=>gapOf(b)-gapOf(a)||(d.conf[a]||3)-(d.conf[b]||3));
  const days=d.exam?dayDiff(d.start,d.exam):Number(d.days)||60;
  let hours=0;for(let i=0;i<days;i++){const dt=new Date(parseD(d.start).getTime()+i*864e5),we=dt.getDay()===0||dt.getDay()===6;hours+=(we?d.mwe:d.mwd)/60;}
  const gap=Math.max(0,target-overallNow),needH=gap*175;
  const verdict=gap<=0?['good','You are already around your target. Focus on consistency and exam technique.']:hours>=needH?['good','Realistic with steady daily work.']:hours>=needH*0.6?['warn','Ambitious but possible. Do not skip days.']:['bad','Very ambitious. Add daily time or choose a later exam date if you can.'];
  return {est,src,overallNow,rank,days,hours:Math.round(hours),needH:Math.round(needH),gap,verdict,sc};
}

  if(Array.isArray(v))return {lv:v[0]||0,due:v[1],isNew:false};
  if(typeof v==='number'&&v>0)return {lv:Math.min(v,3),due:dnum(),isNew:false};
  return {lv:0,due:dnum(dateOf(k)),isNew:true};
}
function dueOf(pool){const today=dnum();return pool.filter(x=>x.due<=today).sort((a,b)=>(a.isNew-b.isNew)||(a.due-b.due));}

    const lv=knew?Math.min(cur.lv+1,INT.length-1):0;dk[sec+':'+i]=[lv,today+(knew?INT[lv]:1)];setDay(n,{dk});return;}
  const w=S.words.find(x=>x.id===id);if(!w)return;const cur=srsOwn(w);

}

/* Line chart of one survey field (h = hours, w = new words) over the plan so far. */
function lineChart(f){
  const t=clampDay(Math.max(1,todayIdx())),W=360,H=170,l=28,r=10,tp=16,b=22;
  const pts=[];for(let n=1;n<=t;n++){const s=survDoc(n);if(s&&s[f]!==''&&s[f]!=null)pts.push({n,v:Number(s[f])||0});}
  const vmax=Math.max(f==='h'?4:20,...pts.map(p=>p.v)),step=f==='h'?(vmax>8?2:1):Math.max(5,Math.ceil(vmax/4/5)*5),ymax=Math.ceil(vmax/step)*step;
  const span=Math.max(t,7),x=n=>l+(n-1)/(span-1)*(W-l-r),y=v=>tp+(H-tp-b)*(1-v/ymax);
  let g='';for(let v=0;v<=ymax;v+=step)g+=`<line x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${l-6}" y="${y(v)+3.5}" text-anchor="end" font-size="9.5" fill="var(--muted)">${v}</text>`;
  const xl=[...new Set([1,Math.round(span/2),span])].map(n=>`<text x="${x(n)}" y="${H-6}" text-anchor="${n===1?'start':n===span?'end':'middle'}" font-size="9.5" fill="var(--muted)">Day ${n}</text>`).join('');
  const line=pts.length>1?`<polyline points="${pts.map(p=>`${x(p.n)},${y(p.v)}`).join(' ')}" fill="none" stroke="var(--navy)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`:'';
  const area=pts.length>1?`<polygon points="${x(pts[0].n)},${y(0)} ${pts.map(p=>`${x(p.n)},${y(p.v)}`).join(' ')} ${x(pts[pts.length-1].n)},${y(0)}" fill="var(--navy)" opacity=".08"/>`:'';
  const dots=pts.map((p,i)=>`<circle cx="${x(p.n)}" cy="${y(p.v)}" r="${i===pts.length-1?4.5:3}" fill="var(--navy)" stroke="var(--card)" stroke-width="1.5"/>`).join('');
  const last=pts.length?`<text x="${x(pts[pts.length-1].n)}" y="${y(pts[pts.length-1].v)-9}" text-anchor="middle" font-size="11" font-weight="800" fill="var(--ink)">${pts[pts.length-1].v}</text>`:'';
  const empty=pts.length?'':`<text x="${(l+W-r)/2}" y="${y(ymax/2)}" text-anchor="middle" font-size="11" fill="var(--muted)">Fill in the daily survey to start the line</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${f==='h'?'Study hours':'New words'} per day">${g}${area}${line}${dots}${last}${xl}${empty}</svg>`;
}
function studyCard(){
  const t=clampDay(Math.max(1,todayIdx()));let tot=0,days=0,wk=0,words=0;
  for(let n=1;n<=t;n++){const s=survDoc(n);if(s&&s.h!==''&&s.h!=null){tot+=Number(s.h)||0;days++;if(n>t-7)wk+=Number(s.h)||0;}if(s&&s.w)words+=Number(s.w)||0;}
  return `<section class="card"><div class="card-h"><h2>Study hours</h2><span class="note">From the daily survey</span></div>
    <div class="stats"><div class="stat"><span class="label">Total</span><span class="v num">${+tot.toFixed(1)}<small> h</small></span></div><div class="stat"><span class="label">Last 7 days</span><span class="v num">${+wk.toFixed(1)}<small> h</small></span></div><div class="stat"><span class="label">Average</span><span class="v num">${days?(tot/days).toFixed(1):'0'}<small> h/day</small></span></div></div>

    if(inTG&&ver('6.2')&&typeof TG.showConfirm==='function'){try{TG.showConfirm('Remove all tasks here? This cannot be undone.',ok=>{if(ok)doReset();});return;}catch(x){}}

  if((el=g('[data-step]'))){const k=el.dataset.step,v=Math.max(0,Math.min(k==='hours'?16:500,num(dayDoc(sel)[k])+Number(el.dataset.by)));setDay(sel,{[k]:v},true);haptic('light');const i=document.getElementById(k==='hours'?'hoursIn':'wordsIn');if(i)i.value=v;renderHeader();return;}
  if((el=g('[data-mood]'))){const v=Number(el.dataset.mood);setDay(sel,{mood:dayDoc(sel).mood===v?0:v});haptic('sel');renderHeader();renderView();return;}
  if((el=g('[data-saveword]'))){const w=DAILY[(Number(el.dataset.saveword)-1)%DAILY.length];if(w&&!S.words.some(x=>x.w.toLowerCase()===w.w.toLowerCase())){S.words.push({id:'w'+Date.now().toString(36),w:w.w,m:w.uz,ex:w.ex,k:0});saveWords();haptic('ok');toast('Saved to my words');renderHeader();renderView();}return;}
  if((el=g('[data-delword]'))){S.words=S.words.filter(w=>w.id!==el.dataset.delword);saveWords();renderHeader();renderView();toast('Word deleted');return;}
  if((el=g('[data-pseg]'))){pSeg=el.dataset.pseg;haptic('sel');renderView();if(pSeg==='write')wTimerLoop();return;}
  if((el=g('[data-wtk]'))){const t=Number(el.dataset.wtk);if(t!==WD8.task){WD8.task=t;WD8.checks={};wWarned=false;saveDraft();haptic('sel');renderView();}return;}
  if((el=g('[data-wt]'))){const a=el.dataset.wt;
    if(a==='start'){WD8.run=Date.now();haptic('medium');}
    else if(a==='pause'){WD8.acc=wElapsed();WD8.run=0;haptic('light');}
    else if(a==='reset'){WD8.acc=0;WD8.run=0;wWarned=false;haptic('light');}
    saveDraft();renderView();wTimerLoop();return;}
  if((el=g('[data-wcopy]'))){const txt=WD8.text.trim();if(wcount(txt)<20){toast('Write at least 20 words first');return;}
    const ok=await copyText(claudePrompt(WD8.task,WD8.q.trim(),txt,Math.max(1,Math.round(wElapsed()/60000))));haptic(ok?'ok':'err');toast(ok?'Copied. Paste it into a chat with Claude':'Could not copy. Select the text and copy it manually');return;}
  if((el=g('[data-ecopy]'))){const e2=S.ess.find(x=>x.id===el.dataset.ecopy);if(e2){const ok=await copyText(claudePrompt(e2.task,e2.q,e2.text,e2.mins));haptic(ok?'ok':'err');toast(ok?'Copied. Paste it into a chat with Claude':'Could not copy');}return;}
  if((el=g('[data-wsave]'))){const txt=WD8.text.trim(),n=wcount(txt);if(n<20){toast('Write at least 20 words first');return;}
    const t=clampDay(Math.max(1,todayIdx()));
    S.ess.push({id:'e'+Date.now().toString(36),task:WD8.task,d:t,date:fmt(new Date()),q:WD8.q.trim(),text:txt,words:n,mins:Math.max(1,Math.round(wElapsed()/60000)),checks:Object.values(WD8.checks).filter(Boolean).length,band:''});
    saveList('ess');WD8={task:WD8.task,q:'',text:'',acc:0,run:0,checks:{}};wWarned=false;saveDraft();clearInterval(wTick);haptic('ok');toast('Essay saved');renderView();return;}
  if((el=g('[data-edel]'))){const id=el.dataset.edel;const go=()=>{S.ess=S.ess.filter(x=>x.id!==id);saveList('ess');haptic('light');toast('Essay deleted');renderView();};
    if(inTG&&ver('6.2')&&typeof TG.showConfirm==='function'){try{TG.showConfirm('Delete this essay? This cannot be undone.',ok=>{if(ok)go();});return;}catch(x){}}
    if(window.confirm('Delete this essay?'))go();return;}
  if((el=g('[data-msk]'))){mAdd.sk=el.dataset.msk;mAdd.ty='';haptic('sel');renderView();return;}
  if((el=g('[data-mty]'))){mAdd.ty=mAdd.ty===el.dataset.mty?'':el.dataset.mty;haptic('sel');
    document.querySelectorAll('[data-mty]').forEach(b=>b.classList.toggle('on',b.dataset.mty===mAdd.ty));return;}
  if((el=g('[data-mdel]'))){S.mist=S.mist.filter(x=>x.id!==el.dataset.mdel);saveList('mist');haptic('light');renderView();return;}
  if((el=g('[data-sv]'))){const a=el.dataset.sv;if(a==='cancel'){svOpen=false;svDraft=null;}else{svOpen=true;svDraft=null;}haptic('sel');renderView();
    if(svOpen){const c=document.getElementById('survey');if(c)c.scrollIntoView({block:'start'});}return;}
  if((el=g('[data-svsk],[data-svr],[data-svdis]'))){svReadForm();if(el.dataset.svsk)svDraft.sk=svDraft.sk===el.dataset.svsk?'':el.dataset.svsk;
    else if(el.dataset.svr)svDraft.r=Number(el.dataset.svr);else{const k=el.dataset.svdis;svDraft.dis=svDraft.dis.includes(k)?svDraft.dis.filter(x=>x!==k):(k==='none'?['none']:[...svDraft.dis.filter(x=>x!=='none'),k]);}
    haptic('sel');const y=scrollY;renderView();scrollTo(0,y);return;}
  if((el=g('[data-wf]'))){wFilter=el.dataset.wf;review=null;haptic('sel');renderView();return;}
  if((el=g('[data-rv]'))){const a=el.dataset.rv;
    if(a==='start'){review={q:dueOf(wordPool()).map(x=>x.id),i:0,show:false,done:0,re:{}};scrollTo(0,0);}
    else if(a==='stop')review=null;
    else if(review){const id=review.q[review.i];if(id){grade(id,a==='knew');if(a==='again'&&!review.re[id]){review.re[id]=1;review.q.push(id);}review.i++;review.done++;review.show=false;}haptic(a==='knew'?'ok':'light');}
    renderView();return;}
  if((el=g('[data-flip]'))){if(review){review.show=!review.show;haptic('sel');renderView();}return;}
  if((el=g('[data-spp]'))){spPart=Number(el.dataset.spp);spQ=0;rec.err='';haptic('sel');renderView();return;}
  if((el=g('[data-sptopic]'))){let n;do{n=Math.floor(Math.random()*SPK.part1.length);}while(n===spT&&SPK.part1.length>1);spT=n;spQ=0;haptic('sel');renderView();return;}
  if((el=g('[data-spq]'))){spQ=Number(el.dataset.spq);haptic('sel');renderView();return;}
  if((el=g('[data-rec]'))){if(el.dataset.rec==='stop')recStop();else recStart(Number(el.dataset.part),el.dataset.label);return;}
  if((el=g('[data-rdel]'))){const id=el.dataset.rdel,r=recs.find(x=>x.id===id);recs=recs.filter(x=>x.id!==id);if(r)try{URL.revokeObjectURL(r.url);}catch(x){}idbDel(id);haptic('light');renderView();return;}
  if((el=g('[data-cue]'))){spQ=0;let n;do{n=Math.floor(Math.random()*CUES.length);}while(n===timer.cue&&CUES.length>1);timer.cue=n;if(timer.phase!=='speak'&&timer.phase!=='prep')timer.phase='idle';renderView();return;}
  if((el=g('[data-timer]'))){const a=el.dataset.timer;
    if(a==='start'){if(recAuto&&MIC)micStream().catch(e=>{rec.err=e&&(e.name==='NotAllowedError'||e.name==='SecurityError')?'denied':'fail';speakRerender();});startPhase('prep',60000);}
    else if(a==='speak')startPhase('speak',120000);
    else if(a==='reset'){clearInterval(tick);timer.phase='idle';if(rec.part===2)recStop();if(rec.state==='idle')micRelease();renderView();}
    return;}
});
document.addEventListener('change',e=>{
  if(WZ){const t=e.target;
    if(t.dataset.wprev){WZ.d.prev[t.dataset.wprev]=t.value;return;}
    if(t.dataset.w){WZ.d[t.dataset.w]=t.type==='date'||t.type==='text'?t.value:Number(t.value);if(t.type==='date'){const y=scrollY;renderView();scrollTo(0,y);}return;}
  }
  if(e.target.dataset.wcheck){WD8.checks[e.target.dataset.wcheck]=e.target.checked;saveDraft();const d=document.getElementById('wcdone');if(d)d.textContent=Object.values(WD8.checks).filter(Boolean).length+'/'+document.querySelectorAll('[data-wcheck]').length;return;}
  if(e.target.dataset.recauto){recAuto=e.target.checked;try{localStorage.setItem('r75pref:recauto',recAuto?'1':'0');}catch(x){}return;}
  if(e.target.id==='mSrc'){mAdd.src=Number(e.target.value);return;}
  const tk=e.target.dataset.task;
  if(tk){setDay(sel,{t:Object.assign({},dayDoc(sel).t,{[tk]:e.target.checked})});const c=doneCount(sel),tot=totalCount(sel);
    if(e.target.checked){haptic(c===tot?'ok':'light');if(c===tot)toast(`Day ${sel} complete`);}renderHeader();renderView();return;}
  const wt=e.target.dataset.wtask;
  if(wt){const w=Math.ceil(sel/7),k='w'+w;S.weeks[k]=Object.assign({},weekDoc(w),{t:Object.assign({},weekDoc(w).t,{[wt]:e.target.checked})});touch(k);if(e.target.checked)haptic('light');renderHeader();renderView();return;}
});
document.addEventListener('input',e=>{
  if(e.target&&e.target.dataset&&e.target.dataset.ka){KANS[e.target.dataset.ka]=e.target.value.slice(0,200);saveKans();return;}
  const t=e.target;
  if(WZ){
    if(t.dataset.w){WZ.d[t.dataset.w]=t.type==='date'||t.type==='text'?t.value:Number(t.value);return;}
    if(t.dataset.wrt!=null){WZ.t.r[Number(t.dataset.wrt)]=t.value;return;}
    if(t.dataset.wlt!=null){WZ.t.l[Number(t.dataset.wlt)]=t.value;return;}
  }
  if(t.closest&&t.closest('[data-plan]')){const pv=document.getElementById('pPreview');if(pv)pv.textContent=planPreview(readPlanForm());return;}
  if(t.dataset.ren){const r=modsRef(goScopeKind(t.dataset.kind));r.m.rename=r.m.rename||{};r.m.rename[t.dataset.ren]=Object.assign({},r.m.rename[t.dataset.ren],{[t.dataset.f]:t.value});r.commit(true);return;}
  if(t.id==='hoursIn'||t.id==='wordsIn'){const k=t.id==='hoursIn'?'hours':'words';setDay(sel,{[k]:t.value===''?'':Math.max(0,Number(t.value))},true);renderHeader();return;}
  if(t.id==='noteIn'){setDay(sel,{note:t.value},true);return;}
  if(t.id==='wtext'){WD8.text=t.value;saveDraft();const n=wcount(t.value),c=document.getElementById('wcount');if(c){c.textContent=`${n} words · minimum ${WLIMIT[WD8.task].min}`;c.classList.toggle('ok',n>=WLIMIT[WD8.task].min);}
    if(!WD8.run&&!WD8.acc&&n>0){WD8.run=Date.now();saveDraft();const b=document.querySelector('.wt-btns');if(b)b.innerHTML='<button class="btn" data-wt="pause">Pause</button><button class="btn ghost" data-wt="reset">Reset</button>';wTimerLoop();}return;}
  if(t.id==='wq8'){WD8.q=t.value;saveDraft();return;}
  if(t.dataset.eband){const e2=S.ess.find(x=>x.id===t.dataset.eband);if(e2){const v=t.value===''?'':Math.max(0,Math.min(9,Number(t.value)));e2.band=v;saveListLater('ess');}return;}
  if(t.id==='wq'){wordQuery=t.value;document.getElementById('wlist').innerHTML=wordItems(searchWords(wordPool()));return;}
  if(t.dataset.mock){
    const n=Number(t.dataset.mock),k=t.dataset.k,mk='m'+pad(n),v=t.value===''?'':Number(t.value);
    S.mocks[mk]=Object.assign({},S.mocks[mk],{[k]:v});touch(mk,true);
    const tab2=k==='L'?LB:k==='R'?RB:null;if(tab2){const h=document.getElementById(`bh-${n}-${k}`);if(h)h.textContent=v===''?'':'Band '+toBand(v,tab2);}
    const o=overall(S.mocks[mk]),p=document.getElementById('ov-'+n);if(p){p.textContent=o==null?'—':o.toFixed(1);p.className='pill '+(o==null?'':o>=TARGET?'hit':o>=7?'c1':'low');}
    document.getElementById('mockChart').innerHTML=mockChart();renderHeader();
  }
});
document.addEventListener('submit',e=>{
  const f=e.target;e.preventDefault();
  if(f.dataset.plan){const p=readPlanForm(),err=planError(p);if(err){toast(err);return;}
    const first=!PLAN;buildSchedule(Object.assign({},PLAN,p));touch('plan');sel=clampDay(todayIdx());closeSheet();haptic('ok');
    toast(first?'Plan saved. Good luck!':'Plan updated');tab='today';renderAll();scrollTo(0,0);return;}
  if(f.dataset.add){const kind=f.dataset.add,nm=document.getElementById(`add-${kind}-name`),nt=document.getElementById(`add-${kind}-note`),label=nm.value.trim();if(!label)return;
    const r=modsRef(goScopeKind(kind));r.m.extra=[...(r.m.extra||[]),{k:'x'+Date.now().toString(36),label,sub:nt.value.trim(),sk:addSk[kind]||''}];r.commit();haptic('light');
    toast(kind==='week'?(editWScope==='allweeks'?'Added to every week':`Added to Week ${Math.ceil(sel/7)}`):editScope==='all'?'Added to every day':`Added to Day ${sel}`);renderHeader();renderView();const again=document.getElementById(`add-${kind}-name`);if(again)again.focus();return;}
  if(f.dataset.svform){svReadForm();const n=Number(f.dataset.svform),d=svDraft;if(d.h===''){toast('Enter your study hours');return;}
    setSurv(n,{h:Math.max(0,Math.min(16,Number(d.h)||0)),w:Math.max(0,Math.min(500,Math.round(Number(d.w)||0))),sk:d.sk||'',r:d.r||0,good:d.good.trim(),bad:d.bad.trim(),tmr:d.tmr.trim(),dis:d.dis,at:Date.now()});
    svOpen=false;svDraft=null;haptic('ok');toast('Survey saved');renderView();const c=document.getElementById('survey');if(c)c.scrollIntoView({block:'start'});return;}
  if(f.dataset.addmist){if(!mAdd.ty){toast('Choose the mistake type');return;}
    const n=Math.max(1,Math.min(40,Number(document.getElementById('mN').value)||1)),note=document.getElementById('mNote').value.trim();
    const q=(document.getElementById('mQ')||{}).value||'';
    S.mist.push(Object.assign({id:'m'+Date.now().toString(36),sk:mAdd.sk,ty:mAdd.ty,n,note,src:Number(mAdd.src)||0,t:Date.now()},mAdd.c?{c:mAdd.c}:{},q.trim()?{q:q.trim()}:{}));saveList('mist');
    haptic('ok');toast('Mistake added');mAdd.ty='';mAdd.c='';renderView();return;}
  if(f.dataset.addword){const w=document.getElementById('nwW').value.trim();if(!w)return;
    S.words.push({id:'w'+Date.now().toString(36),w,m:document.getElementById('nwM').value.trim(),ex:document.getElementById('nwE').value.trim(),k:0});saveWords();haptic('ok');toast('Word saved');renderHeader();renderView();const again=document.getElementById('nwW');if(again)again.focus();}
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){for(const k in timers){clearTimeout(timers[k]);const o=getObj(k);if(o)put(k,JSON.stringify(o));}}else{renderHeader();}});

/* ---------- boot ---------- */
/* Private app: only these Telegram accounts can use it (the Worker enforces the same list). */
const OWNER_IDS=[5020539876];
const TG_UID=inTG&&TG.initDataUnsafe&&TG.initDataUnsafe.user?Number(TG.initDataUnsafe.user.id):null;
const ALLOWED=TG_UID!=null&&OWNER_IDS.includes(TG_UID);
(async()=>{
  if(!ALLOWED){
    document.getElementById('hdr').innerHTML='<div class="hdr-top"><div class="eyebrow">IELTS tracker</div></div><div class="hdr-day"><div class="day">Private app</div></div>';
    document.getElementById('tabs').hidden=true;
    document.getElementById('view').innerHTML=`<div class="wrap"><section class="card"><h2>This tracker is private</h2><p class="note" style="margin:0">${inTG?'It belongs to one person and is not open to other Telegram accounts.':'Open it from its Telegram bot.'}</p></section></div>`;
    try{if(inTG)TG.ready();}catch(e){}
    return;
  }
  renderHeader();renderTabs();
  try{const r=await fetch('daily.json',{cache:'no-cache'});if(r.ok)DAILY=await r.json();}catch(e){}
  await loadDailyIndex();
  await loadSpeaking();
  await load();
  loadBooks();
  if(PLAN)buildSchedule(PLAN);else{buildSchedule(planDefaults());PLAN=null;}
  try{applySeeds();}catch(e){}
  sel=clampDay(todayIdx());
  if(svHash){const q=survDoc(clampDay(todayIdx()));svOpen=!(q&&q.h!=null);}
  renderAll();focusSync();ensurePacks();wTimerLoop();
  if(svHash)setTimeout(()=>{const c=document.getElementById('survey');if(c)c.scrollIntoView({block:'start'});},50);
  let last=todayIdx();setInterval(()=>{const t=todayIdx();if(t!==last){last=t;sel=clampDay(t);renderAll();}},60000);
})();
})();
